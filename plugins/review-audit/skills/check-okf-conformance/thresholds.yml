# check-okf-conformance — Configurable Thresholds
#
# Override by placing a modified copy in your project's
# .claude/skills/check-okf-conformance/thresholds.yml.

# THE OKF VERSION PIN — the single source, read by every consumer.
#
# `pinned_version` is the OKF spec revision this validator targets. Both
# patterns.py and patterns.sh read it FROM HERE; neither carries a literal
# version of its own, and neither may. This mirrors the ruff pin rule in
# CLAUDE.md ("The ruff version is pinned in exactly one place"): a hand-copied
# constant in each consumer is exactly how versions drift apart.
#
# Resolution order in both impls: $OKF_PINNED_VERSION -> this file -> FAIL LOUD.
# The env var exists for tests and for a consumer repo pinning a different
# revision without editing a vendored file; it is not a second source of truth.
#
# UNRESOLVABLE IS A HARD ERROR, NOT A SKIP. Without a pin there is nothing to
# compare a bundle's declared okf_version against, so an exit-0-with-no-findings
# would report a bundle clean that was never actually checked — the silent
# fail-open the runtime policy exists to prevent (#538/#571). This is the
# TOOL-side failure, and it is deliberately the opposite posture from the
# BUNDLE-side permissiveness below.
#
# `spec_checked` records when the spec was last re-read against this pin. The
# epic (#664) requires re-reading the spec each slice and recording both facts.
# Spec source: github.com/openknowledge-sh/openknowledge Wiki/SPEC.md, itself a
# pinned upstream copy of GoogleCloudPlatform/knowledge-catalog okf/SPEC.md.
okf:
  pinned_version: "0.2" # OKF_PINNED_VERSION
  spec_checked: "2026-08-19"

# THE BUNDLE ROOT is NOT configured here — it is an environment variable, so one
# setting can move every bundle-aware scanner at once. Resolution order:
#
#   $OKF_BUNDLE_ROOT -> $MEMORY_BUNDLE_ROOT -> .claude/memory
#
# MEMORY_BUNDLE_ROOT is check-decomposition's existing convention (#700);
# sharing it means the two scanners cannot disagree about which files are bundle
# files. OKF_BUNDLE_ROOT is the escape hatch for a repo whose OKF bundle is not
# its memory bundle. An EMPTY value means no bundle is configured: no findings,
# no error.

# Per-category severity. Every one of these is a FINDING AT EXIT 0 — see the
# permissive-conformance rule in SKILL.md. A non-conformant bundle is reported,
# never rejected.
severity:
  okf-missing-type:
    absent_or_empty: medium
  okf-unparseable-frontmatter:
    unparseable: medium
  okf-version-drift:
    # LOW on purpose, and it exits 0. Spec §12: a consumer meeting an
    # unfamiliar declared version SHOULD attempt best-effort consumption rather
    # than refusing the bundle. Drift is worth surfacing, never worth failing.
    declared_differs: low
  okf-reserved-file-structure:
    index_frontmatter: medium
    log_date_format: medium

min_confidence:
  deterministic: 0.9
  heuristic: 0.7
  llm: 0.5

# --- SLICE B: BUNDLE GRAPH + HEALTH (#669) -----------------------------------
#
# Slice A (above) asks whether each FILE meets the OKF schema floor. This block
# configures the whole-BUNDLE pass: is a concept reachable from an index, does
# an index promise a file that is not there, is a concept indexed twice, has a
# memory outlived its own expiry.
#
# CONFIG, NOT CONVENTION. Every default below is librarian's own habit, and a
# consuming repo overrides it without touching code — that portability is an
# acceptance criterion of #669, not a nicety. Both list keys use the SAME
# `- item` shape so ONE parser reads both: a second parse shape is a second
# place the bash and python twins can disagree.
health:
  # Which files ROUTE recall. A basename here is matched literally; one
  # containing `*` is a glob. Everything else under the bundle root that is not
  # a reserved OKF file is a CONCEPT.
  #
  # These three are OKF's `index.md` plus librarian's `MEMORY.md` /
  # `index-<topic>.md` convention. check-decomposition hardcodes the same three
  # (prose_spec.py bundle_kind()); here they are defaults precisely BECAUSE a
  # consuming repo whose index is `toc.md` must not be told its entire bundle is
  # orphaned. Overridable as OKF_INDEX_NAMES (space-separated).
  index_names:
    - MEMORY.md
    - index.md
    - index-*.md

  # Per-`type` required body sections, as `<type> = <section> | <section>`.
  # A type ABSENT from this list has NO body requirement — that is the
  # portability default: an unfamiliar vocabulary yields ZERO memory-missing-why
  # rows rather than a wrong one for every file. OKF §4.1 registers no types
  # centrally and requires consumers to tolerate unknown ones, so requiring
  # sections of a type nobody configured would contradict the spec.
  #
  # The two below are librarian's MEMORY.md rule ("for feedback/project, follow
  # with **Why:** and **How to apply:** lines") stated as config.
  body_requirements:
    - feedback = **Why:** | **How to apply:**
    - project = **Why:** | **How to apply:**

# NO INDEX LINE BUDGET LIVES HERE — deliberately, and this comment is the
# reason. Index sizing and the topic-clustered split recommendation are ALREADY
# emitted by check-decomposition, which owns the one authoritative prose
# threshold table. Measured 2026-09-05 on a 275-line MEMORY.md:
#
#   ai-file-bloat       memory index exceeds high threshold: 275 lines (>250)
#   decomposition-seam  index split: 3 topic clusters (...) -> index-<topic>.md
#
# Defining `memory_index.warning` here would create a SECOND table over the same
# files that must agree with the first — exactly the duplication #663 was filed
# to eliminate, and the argument already recorded on #589 for plugin prose. The
# budgets live in check-decomposition/thresholds.yml § bloat_thresholds
# (memory_index / memory_concept). Change them there; this scanner reads none.

# Per-category severity for the health pass. Like every slice-A category these
# are FINDINGS AT EXIT 0 — the bundle is reported, never rejected (§11/§12).
severity_health:
  memory-orphan: medium
  memory-dangling-index: medium
  memory-multi-index: low
  memory-stale: low
  memory-missing-why: low
