# check-decomposition — Configurable Thresholds
#
# Override by placing a modified copy in your project's
# .claude/skills/check-decomposition/thresholds.yml.
#
# Every value below is also readable as an environment variable of the same
# name in UPPER_SNAKE (shown per entry), which is how the orchestrator passes a
# project override through to both patterns.py and patterns.sh.

severity:
  file-length:
    over_warning: medium
    over_high: high
  god-module:
    size_and_concerns: medium
  ai-file-bloat:
    over_warning: medium
    over_high: high
  doc-file-bloat:
    over_warning: medium
    over_high: high
  decomposition-seam:
    extractable: medium
    # `low`, not `info`: finding-schema.md's severity enum is exactly
    # critical|high|medium|low, and the aggregator filters/sorts on it.
    declined: low

# Production-LOC thresholds. Production LOC excludes blank lines, comment lines,
# and test units (per-language, computed from unit spans).
#
# These apply ONLY to files that bloat_thresholds below does not classify (#701).
# A classified file gets its per-type budget instead — see that section.
#
# THIS IS THE AUDIT LENS. It is consumed by /review-audit:codebase-audit, which
# sweeps a WHOLE REPO on a periodic cadence. See review_size_thresholds below for
# the per-PR review lens, which is deliberately looser — the two are reconciled
# on purpose, not by accident (#695).
#
# The two scopings are orthogonal and both apply: #701 decides WHICH files this
# section governs (the unclassified ones), #695 decides which LENS reads it (the
# audit sweep, not the per-PR review).
size_thresholds:
  production_loc:
    warning: 300 # DECOMP_LOC_WARN
    high: 500 # DECOMP_LOC_HIGH

# THE REVIEW LENS (#695) — consumed by ship-issue's sizing.{py,sh} during the
# adversarial pre-PR review, NOT by the audit sweep above.
#
# WHY IT IS LOOSER THAN THE AUDIT LENS. The two lenses ask different questions.
# An audit sweeps a whole repo, produces a backlog, and can afford to nag: a
# 300-LOC warning there costs one more item on a list somebody triages later. A
# per-PR gate spends a reviewer's attention on every single PR, and one that
# fires at 300 production LOC fires on a large share of them — at which point it
# gets turned off, and then it catches nothing at all. The looser pair buys a
# lens that survives.
#
# The review lens is also GROWTH-AWARE, which the audit lens is not and cannot
# be: it reads a `git diff --numstat` sidecar so a one-line touch to a
# pre-existing oversized file is informational rather than blocking. The
# thresholds below therefore gate a *different question* ("did this diff make it
# worse?"), not merely the same question at a higher number.
review_size_thresholds:
  production_loc:
    warning: 500 # REVIEW_LOC_WARN
    high: 800 # REVIEW_LOC_HIGH
  # Minimum added lines before growth on an ALREADY-over file counts as this
  # PR's business. Below this the row is emitted at LOW/informational.
  growth_min_added: 50 # REVIEW_GROWTH_MIN_ADDED
  # A file at or under this many top-level units declines as "single cohesive
  # unit" rather than being reported as splittable.
  cohesive_max_units: 2 # REVIEW_COHESIVE_MAX_UNITS

  # Per-language overrides on top of the default pair above. A 500-line Rust file
  # and a 500-line shell script are not the same claim: shell and markdown are
  # line-hungry by nature (one statement per line; prose wraps), while Rust and Go
  # pack more meaning per line and turn over harder when long.
  #
  # A language ABSENT here falls through to the default pair — adding one is a
  # one-line edit, and an unlisted language is still sized rather than silently
  # skipped.
  per_language:
    sh:
      warning: 700 # REVIEW_LOC_WARN_SH
      high: 1000 # REVIEW_LOC_HIGH_SH
    md:
      warning: 700 # REVIEW_LOC_WARN_MD
      high: 1000 # REVIEW_LOC_HIGH_MD
    rs:
      warning: 400 # REVIEW_LOC_WARN_RS
      high: 700 # REVIEW_LOC_HIGH_RS
    go:
      warning: 400 # REVIEW_LOC_WARN_GO
      high: 700 # REVIEW_LOC_HIGH_GO

# Non-lossy split verification (#695 AC8), consumed by ship-issue's
# split-verify.{py,sh}. Tolerance for the import/`mod`/`__init__` boilerplate a
# split legitimately adds — the check exists to catch a LOST HALF, not to police
# a few scaffold lines, so it is deliberately generous.
split_verification:
  loc_tolerance: 40 # SPLIT_LOC_TOLERANCE

# What makes a candidate span worth reporting as a seam.
seam:
  min_units: 3 # DECOMP_SEAM_MIN_UNITS — units in the family cluster
  min_lines: 40 # DECOMP_SEAM_MIN_LINES — span size worth moving
  max_fanin: 3 # DECOMP_SEAM_MAX_FANIN — at/under this, callers are named

# god-module needs size AND many units AND several distinct concerns. The
# cross-file coupling half of this category stays with audit-architecture.
god_module:
  min_units: 12 # DECOMP_GOD_UNITS
  min_concerns: 3 # DECOMP_GOD_CONCERNS

# A file at or under this many top-level units is reported as "single cohesive
# unit" rather than as an unsplittable mystery.
cohesive:
  max_units: 2 # DECOMP_COHESIVE_MAX_UNITS

# Per-file-type line thresholds for AI-instruction and documentation files.
# Migrated from check-ai-config (issue #663) with the env var names intact, so
# an operator's existing overrides keep working across the move.
#
# MEASURED ON TOTAL LINES, deliberately (#701) — unlike size_thresholds above,
# NOTHING is excluded: not blanks, not frontmatter, not fenced blocks. These
# files are loaded WHOLE into context, so every line is real cost. (Production
# LOC would be the wrong metric here anyway: markdown has no comment or test
# exclusion, so it degenerates into "lines minus blanks".)
#
# This is also the ONLY size verdict a classified file receives — the
# production-LOC file-length check above is SKIPPED for it. A spec here IS the
# statement "this file type has its own budget", so judging it a second time
# against code-derived thresholds contradicts that: it produced duplicate rows,
# and flagged docs pages that were under their own configured budget.
bloat_thresholds:
  claude_md: # CLAUDE.md / AGENTS.md — loaded every conversation
    warning: 400 # CLAUDE_MD_WARN
    high: 600 # CLAUDE_MD_HIGH
  skill_md: # skills/*/SKILL.md — loaded when the skill activates
    warning: 300 # SKILL_WARN
    high: 500 # SKILL_HIGH
  agent_md: # agents/*.md — loaded per agent dispatch
    warning: 250 # AGENT_WARN
    high: 400 # AGENT_HIGH
  doc_md: # docs/*.md — not auto-loaded, but hard to navigate when huge
    warning: 500 # DOC_WARN
    high: 800 # DOC_HIGH

min_confidence:
  deterministic: 0.9
  heuristic: 0.7
  llm: 0.5
