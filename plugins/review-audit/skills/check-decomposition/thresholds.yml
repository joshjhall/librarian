# check-decomposition — Configurable Thresholds
#
# Override by placing a modified copy in your project's
# .claude/skills/check-decomposition/thresholds.yml.
#
# Every value below is also readable as an environment variable of the same
# name in UPPER_SNAKE (shown per entry), which is how the orchestrator passes a
# project override through to both patterns.py and patterns.sh.

severity:
  file-length:
    over_warning: medium
    over_high: high
  god-module:
    size_and_concerns: medium
  ai-file-bloat:
    over_warning: medium
    over_high: high
  doc-file-bloat:
    over_warning: medium
    over_high: high
  decomposition-seam:
    extractable: medium
    # `low`, not `info`: finding-schema.md's severity enum is exactly
    # critical|high|medium|low, and the aggregator filters/sorts on it.
    declined: low

# Production-LOC thresholds. Production LOC excludes blank lines, comment lines,
# and test units (per-language, computed from unit spans).
#
# These apply ONLY to files that bloat_thresholds below does not classify (#701).
# A classified file gets its per-type budget instead — see that section.
size_thresholds:
  production_loc:
    warning: 300 # DECOMP_LOC_WARN
    high: 500 # DECOMP_LOC_HIGH

# What makes a candidate span worth reporting as a seam.
seam:
  min_units: 3 # DECOMP_SEAM_MIN_UNITS — units in the family cluster
  min_lines: 40 # DECOMP_SEAM_MIN_LINES — span size worth moving
  max_fanin: 3 # DECOMP_SEAM_MAX_FANIN — at/under this, callers are named

# god-module needs size AND many units AND several distinct concerns. The
# cross-file coupling half of this category stays with audit-architecture.
god_module:
  min_units: 12 # DECOMP_GOD_UNITS
  min_concerns: 3 # DECOMP_GOD_CONCERNS

# A file at or under this many top-level units is reported as "single cohesive
# unit" rather than as an unsplittable mystery.
cohesive:
  max_units: 2 # DECOMP_COHESIVE_MAX_UNITS

# Per-file-type line thresholds for AI-instruction and documentation files.
# Migrated from check-ai-config (issue #663) with the env var names intact, so
# an operator's existing overrides keep working across the move.
#
# MEASURED ON TOTAL LINES, deliberately (#701) — unlike size_thresholds above,
# NOTHING is excluded: not blanks, not frontmatter, not fenced blocks. These
# files are loaded WHOLE into context, so every line is real cost. (Production
# LOC would be the wrong metric here anyway: markdown has no comment or test
# exclusion, so it degenerates into "lines minus blanks".)
#
# This is also the ONLY size verdict a classified file receives — the
# production-LOC file-length check above is SKIPPED for it. A spec here IS the
# statement "this file type has its own budget", so judging it a second time
# against code-derived thresholds contradicts that: it produced duplicate rows,
# and flagged docs pages that were under their own configured budget.
bloat_thresholds:
  claude_md: # CLAUDE.md / AGENTS.md — loaded every conversation
    warning: 400 # CLAUDE_MD_WARN
    high: 600 # CLAUDE_MD_HIGH
  skill_md: # skills/*/SKILL.md — loaded when the skill activates
    warning: 300 # SKILL_WARN
    high: 500 # SKILL_HIGH
  agent_md: # agents/*.md — loaded per agent dispatch
    warning: 250 # AGENT_WARN
    high: 400 # AGENT_HIGH
  doc_md: # docs/*.md — not auto-loaded, but hard to navigate when huge
    warning: 500 # DOC_WARN
    high: 800 # DOC_HIGH
  # Memory-bundle markdown (#700). A bundle file is neither code nor a docs
  # page, and before #700 it matched no arm here — so it fell through to the
  # production-LOC code thresholds above (300/500), silently sized by a rule
  # written for source. These two arms are what stop that.
  #
  # The bundle splits into two budgets because it holds two distinct things:
  memory_index: # MEMORY.md / index-*.md — loaded EVERY session
    # Budgeted as a READ LIMIT, not a maintenance limit: an index's job is to be
    # scannable, so the failure mode is "too long to read", not "too long to
    # maintain". Hence a tighter budget than any concept.
    warning: 150 # MEMORY_INDEX_WARN
    high: 250 # MEMORY_INDEX_HIGH
  memory_concept: # every other bundle .md — one recalled fact
    # Budgeted by what a single recalled fact should cost to load into context.
    warning: 200 # MEMORY_CONCEPT_WARN
    high: 350 # MEMORY_CONCEPT_HIGH

# Where the memory bundle lives. CONFIGURABLE, not hardcoded (#700) — the same
# portability rule every OKF slice carries, so a consuming repo whose bundle is
# elsewhere is classified correctly rather than not at all.
#
# An EMPTY value disables memory classification entirely: no bundle configured
# means no memory findings and NO error. That is also how a repo opts out.
memory_bundle:
  root: .claude/memory # MEMORY_BUNDLE_ROOT

# THIS TABLE IS AUTHORITATIVE FOR MEMORY SIZING — three consumers read it: the
# audit lens, #695's review lens, and #669's index health. #669 must read
# memory_index/memory_concept FROM HERE rather than defining its own
# `memory-index-bloat` config: two threshold tables over the same files that
# must agree is exactly the duplicated-prose failure #663 was filed to
# eliminate, and the same argument already recorded on #589 for plugin prose.

min_confidence:
  deterministic: 0.9
  heuristic: 0.7
  llm: 0.5
