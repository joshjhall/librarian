# check-ai-config — Configurable Thresholds
#
# Override by placing a modified copy in your project's
# .claude/skills/check-ai-config/thresholds.yml.

severity:
  agent-frontmatter:
    missing_field: high
    invalid_model: high
    wildcard_tools: medium
    naming_convention: medium
  skill-frontmatter:
    missing_description: high
    missing_workflow: medium
    missing_metadata: medium
  claude-md-drift:
    broken_reference: medium
  config-inconsistency:
    missing_agent: medium
    missing_skill: medium
  mcp-misconfiguration:
    insecure_http: high
  hook-safety:
    destructive_command: high
    secret_leak: high
  harness-logic:
    ref_collision: medium
    unsafe_regen: medium
    unsafe_interpolation: high

# bloat_thresholds moved to check-decomposition/thresholds.yml (issue #663)
# along with the ai-file-bloat / doc-file-bloat categories, so one tool owns
# line counting. The env var names (CLAUDE_MD_WARN, SKILL_*, AGENT_*, DOC_*)
# are unchanged there, so an existing project override keeps working.

min_confidence:
  deterministic: 0.9
  heuristic: 0.7
  llm: 0.5
