# check-security — OWASP Top 10 (2021) coverage map
#
# THE POINT OF THIS FILE: before it existed, this repo CLAIMED OWASP coverage in
# two places and could not show it. `agents/audit-security.md`'s frontmatter says
# "OWASP patterns"; `dev-core/agents/code-reviewer/workflow.js`'s
# `SUBREVIEWERS.security` has one bullet reading `- OWASP Top 10 vulnerabilities`.
# Neither mapped a single scanner category to an `A0x` id, so the claim could not
# be checked, could not be tested, and could not regress visibly (#705, #706).
#
# This map makes the claim FALSIFIABLE. Every A01-A10 entry lists the categories
# that address it and names which pass owns each one. What is NOT covered is
# written down as an explicit `gap` with a reason, rather than being absent and
# therefore indistinguishable from covered.
#
# ENFORCED by tests/validate-owasp-coverage.sh (registered in tests/run-all.sh),
# which asserts: all ten ids present exactly once; every `prescan` id is a
# category the scanners ACTUALLY emit (derived from patterns.{py,sh} source, both
# directions, so a renamed detector fails loudly); every `llm-pass2` / `reviewer`
# id is backed by real text in its checklist; every `gap` carries a reason.
#
# THE FOUR OWNERS map to the passes that exist today:
#
#   prescan    — a deterministic category slug emitted by BOTH
#                check-security/patterns.py and patterns.sh. Since #708 that
#                SCANNER runs on BOTH paths: the audit sweep
#                (/review-audit:codebase-audit) and the per-PR review path,
#                which reaches the same script through ship-issue's
#                pre-review-gates.sh. (Only the deterministic half travels —
#                the `llm-pass2` checklist remains audit-only, which is why it
#                is a separate owner.) Before it, every `prescan` row was
#                audit-only and the review path's `security` dimension had no
#                deterministic input at all — an `owner: prescan` row therefore
#                over-claimed on the path where a defect is cheapest to stop.
#                No row's OWNER changed (each already named the right pass);
#                what changed is that the claim is now true on both.
#   llm-pass2  — a `### <id>` checklist section in pass2-checklist.md, THIS
#                DIRECTORY's sibling. It lived in
#                plugins/review-audit/agents/audit-security.md until #709 moved
#                it here: the agent had outgrown its 400-line budget, and the
#                checklist is the half that pairs with this map rather than with
#                the agent's dispatch mechanics. Co-locating them is what makes
#                the coupling visible — the gate reads both files to check they
#                agree, in both directions.
#   reviewer   — a bullet in SUBREVIEWERS.security in
#                plugins/dev-core/agents/code-reviewer/workflow.js
#   gap        — nothing covers it yet; MUST carry a non-empty `reason`
#
# `evidence:` names the exact backing text when it differs from the id. The
# reviewer bullets are prose and carry no slugs at all, so every `reviewer` entry
# still needs one. Slice D (#709) has since landed: the Pass-2 checklist now
# carries real `### <id>` sections and an A0x column, so most `llm-pass2` rows
# match on their id alone.
#
# `evidence` survives for two reasons that are not going away. The reviewer
# bullets are still prose. And where a category is covered by BOTH a scanner and
# the LLM pass, the two rows cannot share an id — hence the `-pass2` suffixes
# (`ssrf-pass2`, `insecure-deserialization-pass2`), each pointing back at the
# checklist's real slug. Those pairs are deliberate, not duplication: the scanner
# owns the SINK, the Pass-2 section owns whether the input reaching it is
# untrusted, and only the second decides whether a hit is a finding.
#
# An entry can be covered at one layer and a gap at another, and several are:
# `reviewer` sees SSRF as a prose bullet while no deterministic detector exists
# for it. Both rows are listed, because "an LLM might notice it" and "a scanner
# will catch it" are different claims.
#
# The review path also FAILS LOUD when it cannot reach this scanner (#708):
# `review-audit` installs independently of `workflow`, so pre-review-gates.sh
# resolves patterns.sh at runtime and exits non-zero rather than reporting a
# clean scan it never ran. That matters to this map's honesty — a `prescan` row
# would otherwise silently mean "covered" on a machine where the scanner is
# absent, which is the one failure mode this file exists to make visible.
#
# The gap reasons point at the sibling slices of epic #705: #707 added the
# command-injection, weak-randomness, tls-verification-disabled, permissive-cors,
# jwt-unverified, insecure-deserialization and xxe detectors; #709 adds the
# missing LLM checklist categories; #898 carries the three detectors #707
# MEASURED and declined to ship (see the A01 and A10 gap reasons).
#
# A `gap` reason is at its most useful when it records a MEASUREMENT rather than
# an intention. "No detector yet" ages into "nobody got to it"; "0 true positives
# in 8 hits, request-derived = 0" tells the next person what to do differently
# and what bar to clear. The A01/A10 rows are written that way deliberately.

A01:
  name: Broken Access Control
  categories:
    - id: auth-bypass
      owner: llm-pass2
    - id: auth-bypass-reviewer
      owner: reviewer
      evidence: "Authentication and authorization bypass"
    - id: path-traversal
      owner: reviewer
      evidence: "Path traversal"
    - id: path-traversal-pass2
      owner: llm-pass2
      evidence: "path-traversal"
    # A01's other half, and the one a route-level checklist cannot express: a
    # handler that authenticates the caller correctly, then loads a record by a
    # request-supplied id without asking whether it belongs to them. Added by
    # #709 to both checklists; it is business logic end to end, so it has no
    # prescan row and never will.
    - id: object-level-authz
      owner: llm-pass2
      evidence: "Object-level (authorization)"
    - id: object-level-authz-reviewer
      owner: reviewer
      evidence: "Broken object-level authorization"
    - id: path-traversal-prescan
      owner: gap
      reason: >-
        MEASURED, not merely deferred (#707). A same-line proxy for
        "argument derives from a request symbol" scored 0 true positives in 7
        hits over a 753-file corpus: every hit was open(sys.argv[N]) in a test
        heredoc, and splitting the taint class showed request-derived = 0 while
        argv = 7 — the arm's entire yield came from its weakest token. Dropping
        argv leaves zero hits, which is an absent calibration corpus rather than
        precision. Per contract.md, a detector whose measured hit rate cannot
        support its tier does not ship at that tier; this supports neither HIGH
        nor MEDIUM. Needs a multi-line taint model. Follow-up: #898

A02:
  name: Cryptographic Failures
  categories:
    - id: insecure-crypto
      owner: prescan
      detects: [md5_sha1, ecb_mode]
    - id: hardcoded-secret
      owner: prescan
      detects: [aws_key, github_token, stripe_key, private_key, generic_credential]
    - id: insecure-crypto-pass2
      owner: llm-pass2
      evidence: "insecure-crypto"
    - id: hardcoded-secret-pass2
      owner: llm-pass2
      evidence: "hardcoded-secret"
    - id: weak-randomness
      owner: prescan
      detects: [math_random_security_context, random_random_security_context]

A03:
  name: Injection
  categories:
    - id: injection-risk
      owner: prescan
      detects: [sql_fstring, sql_concat, template_literal_sql]
    - id: xss-risk
      owner: prescan
      detects: [react_innerhtml, vue_vhtml, template_safe, blade_unescaped]
    - id: injection
      owner: llm-pass2
    - id: xss
      owner: llm-pass2
    - id: injection-reviewer
      owner: reviewer
      evidence: "Injection vulnerabilities (SQL, command, LDAP, XPath)"
    - id: command-injection
      owner: prescan
      detects: [shell_true, os_system, child_process_exec, eval_nonliteral]

A04:
  name: Insecure Design
  categories:
    # Was a `gap` until #709 gave it a Pass-2 section. Still has no prescan row
    # and cannot get one: a missing control is not a pattern. The checklist
    # section is deliberately restrictive about what counts, because A04 is the
    # easiest category in the list to fill with architectural opinion.
    - id: insecure-design
      owner: llm-pass2

A05:
  name: Security Misconfiguration
  categories:
    - id: data-exposure
      owner: llm-pass2
    - id: tls-verification-disabled
      owner: prescan
      detects: [requests_verify_off, node_reject_unauthorized_off, go_insecure_skip_verify, node_tls_env_off]
    - id: permissive-cors
      owner: prescan
      detects: [wildcard_origin, reflected_origin]
    # XXE was its own category (A04) in the 2017 list; the 2021 revision folded
    # it into A05, since an XML parser left resolving external entities is a
    # parser CONFIGURATION defect. Mapped here rather than given a fabricated id
    # so the map matches the edition it names in its title.
    - id: xxe-risk
      owner: prescan
      detects: [resolve_entities_on, php_entity_loader_on, java_xmlconstants]

A06:
  name: Vulnerable and Outdated Components
  categories:
    - id: dependency-cve
      owner: llm-pass2

A07:
  name: Identification and Authentication Failures
  categories:
    - id: auth-bypass-authn
      owner: llm-pass2
      evidence: "auth-bypass"
    - id: jwt-unverified
      owner: prescan
      detects: [alg_none, decode_without_verify]

A08:
  name: Software and Data Integrity Failures
  categories:
    - id: insecure-deserialization-reviewer
      owner: reviewer
      evidence: "Insecure deserialization"
    - id: insecure-deserialization
      owner: prescan
      detects: [pickle_loads, yaml_load_unsafe, marshal_load, java_readobject, php_unserialize]
    # Complements the prescan row rather than duplicating it, and the split is
    # the whole argument for having both: the scanner owns the SINK (it is a
    # literal call), the Pass-2 section owns whether the input reaching it is
    # untrusted, which is the half that decides whether a hit is a finding.
    - id: insecure-deserialization-pass2
      owner: llm-pass2
      evidence: "insecure-deserialization"

A09:
  name: Security Logging and Monitoring Failures
  categories:
    # Was a `gap` until #709 gave it a Pass-2 section. The old reason's first
    # clause still holds and always will — an ABSENCE has nothing for a pattern
    # to match — which is why this stays llm-pass2-only with no prescan row.
    # What changed is the second clause: the checklist section now exists.
    - id: logging-monitoring
      owner: llm-pass2

A10:
  name: Server-Side Request Forgery
  categories:
    - id: ssrf-reviewer
      owner: reviewer
      evidence: "SSRF (server-side request forgery)"
    # #709. Note this sits alongside the `ssrf` GAP row below, and the pair is
    # not a contradiction: the gap is about the PRESCAN, measured and declined
    # at any tier, while this row is the LLM pass that owns exactly the judgment
    # the scanner could not make. A10 is covered by a human-grade read and not
    # by a pattern — two different claims, which is why both rows are listed.
    - id: ssrf-pass2
      owner: llm-pass2
      evidence: "ssrf"
    - id: ssrf
      owner: gap
      reason: >-
        MEASURED, not merely deferred (#707). The same-line request-symbol proxy
        scored 0 true positives in 1 hit over a 753-file corpus — a test
        health-check whose host is a hardcoded literal and only the port
        interpolates. Same verdict and same rule as A01's path-traversal-prescan
        row: not regex-reachable at any tier without a taint model.
        Follow-up: #898
