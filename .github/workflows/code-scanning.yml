name: Code scanning

# agnix → GitHub code scanning (issue #399; ADR
# plugins/review-audit/docs/adr/0001-agnix-check-ai-config-boundary.md §4).
# This is the author/CI SARIF surface of the agnix integration spine — separate
# from the `checker` batch path (which consumes agnix via the JSON→TSV
# normalizer, #397). It runs agnix over the repo's OWN AI-config artifacts and
# uploads the SARIF so findings appear as native PR code-scanning annotations
# with cross-run dedup.
#
# Deliberately its OWN workflow, not a job in ci.yml:
#   - SARIF upload needs `security-events: write`; ci.yml declares least-privilege
#     `contents: read` at the workflow level and that contract must not widen.
#   - It is INFORMATIONAL, like ci.yml's coverage job — NOT part of the merge-gate
#     aggregation, so an agnix finding annotates a PR without redding it. Per the
#     ADR, SARIF is for annotations/dedup, not a hard merge block.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# security-events:write is required to upload SARIF to code scanning; contents
# stays read-only (the scan reads the tree as data). Declared at the workflow
# level so the single job inherits exactly this scope.
permissions:
  contents: read
  security-events: write

jobs:
  agnix-sarif:
    name: agnix → code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork PRs cannot write `security-events` (GitHub withholds that token scope
    # from forks), so the upload would fail — skip the whole job on fork PRs,
    # matching the trust boundary ci.yml applies to quality-gates/coverage. The
    # first clause keeps push + workflow_dispatch running (their pull_request
    # context is null, so the head.repo check alone would wrongly skip them).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Pin agnix (ADR §5: no @latest — a floating bump can add rules that red a
      # previously-green tree with no code change).
      #
      # FLOOR IS 0.48.1, NOT COSMETIC (#734). Versions <= 0.47.0 carry stale
      # frontmatter/tools parsers that emit dozens of phantom errors on a tree
      # that is actually clean — measured on this repo at the config in
      # .agnix.toml, as TOTALS of which 10 are real (so the phantom count is the
      # row minus 10, and it is not one constant across the pre-floor range):
      #     0.40.0 (the old pin) -> 57 errors    0.43.0 -> 57
      #     0.47.0               -> 50 errors    0.48.1 -> 10    0.49.0 -> 10
      # The phantoms are self-evidently wrong: AS-002 "missing required 'name'
      # field" against skills whose frontmatter has no `name` key BY DESIGN
      # (directory-derived), CC-AG-009 "unknown tool 'diff:*)'" from splitting
      # `Bash(git diff:*)` on the comma inside its own parens, CC-AG-003 against
      # the valid `model: fable`. The .agnix.toml [[overrides]] cannot suppress
      # them and must not try — they are parser bugs, not findings to silence.
      #
      # So the 0-error contract holds only at >= 0.48.1, and this pin is what
      # makes CI's annotation agree with a local run. tests/lint-agnix-clean.sh
      # encodes the same floor and SKIPS (sentinel 77) below it, rather than
      # reporting a phantom failure. No dependabot ecosystem covers this pin
      # (github-actions only), so bumping it is always a deliberate edit: re-run
      # that gate against the new version before changing the number.
      #
      # Offline-tolerant: if the install fails (registry hiccup,
      # npm-less/network-restricted runner), log
      # a clear skip and set an output so the scan + upload steps no-op rather
      # than hard-failing the job — agnix is a best-effort enrichment, not a
      # required gate (acceptance: "agnix-absent → clear skip, not a hard
      # failure").
      #
      # Signature verification (#740). The pin above fixes WHICH version npm
      # serves; it says nothing about whether the tarball npm serves for that
      # version is the one its publisher signed. `npm audit signatures` checks
      # the registry signature — and this job is the one that matters most: it
      # reads this repo's config and WRITES a code-scanning annotation, so a
      # substituted tarball would run with `security-events: write` in hand.
      #
      # It cannot be appended after `npm install -g`: npm rejects the pairing
      # outright with `EAUDITGLOBAL: does not support global packages`. The audit
      # reads a package.json/package-lock.json pair, which only a LOCAL install
      # tree has. So verification happens in a throwaway prefix first, and the
      # global install is gated on it.
      #
      # `--ignore-scripts` on that scratch install is the load-bearing half. The
      # order is verify-THEN-install precisely so a tampered tarball's
      # `postinstall` never executes; letting scripts run during the scratch
      # install would run attacker code first and check the signature afterward,
      # which is the same as not checking it. tests/lint-agnix-clean.sh asserts
      # the flag is still there, because losing it leaves a check that looks
      # right and protects nothing.
      #
      # The global install then reads the VERIFIED DIRECTORY, not the registry:
      # `npm install -g --install-links "$verify_dir/node_modules/agnix"`. This
      # is the whole point of the sequence and is not interchangeable with
      # re-installing `"$pin"` globally. (`--install-links` copies rather than
      # symlinks so the install survives this step's cleanup — #766; it does not
      # reach the registry, so the guarantee below is unaffected.)
      #
      # Re-resolving `"$pin"` would be two independent fetches — the audit would
      # describe bytes the first fetch received while a second, unaudited fetch
      # supplied the bytes that actually run, and `-g` is where `postinstall`
      # executes. That is a TOCTOU window: registry immutability and cache reuse
      # usually close it, but "usually" is not a property a supply-chain check
      # should rest on, and nothing in the script enforces either. Installing the
      # verified tree makes the audited bytes and the installed bytes the same
      # bytes by construction, so the guarantee holds without that assumption.
      #
      # SCOPE OF THAT GUARANTEE, stated exactly because the general case is
      # weaker than it looks: `npm install -g --install-links <local-dir>` PACKS
      # the directory (measured — note that WITHOUT `--install-links` npm
      # symlinks instead and packs nothing, which is the #766 defect; ci.yml's
      # comment and this one disagreed on this point until #766 measured it),
      # and a pack conventionally excludes `node_modules`. For a package with
      # runtime dependencies, npm would re-resolve that dependency closure from
      # the registry — a second unaudited fetch, the same TOCTOU shape one level
      # down. agnix has NO dependencies of any kind (no `dependencies`,
      # `optionalDependencies`, or `peerDependencies`; its lockfile closure in
      # the scratch tree is the single entry `node_modules/agnix`), so the
      # audited closure and the installed closure are the same one package.
      # Confirmed empirically: `npm install -g --install-links --offline` from
      # the verified tree succeeds, which it could not do if any byte still had
      # to be fetched. Re-confirmed with `--install-links` when #766 added it.
      #
      # This is therefore a property of agnix, not of the pattern. Should agnix
      # ever gain a dependency, this reasoning stops holding and the step needs
      # revisiting — reuse the same `--offline` check to tell, since it fails
      # loudly the moment something must be fetched.
      - name: Install agnix (pinned)
        id: agnix
        run: |
          # Smoke-test inside the CONDITION, and set `present` only after it
          # passes. Two bugs this shape avoids, both reachable when the install
          # succeeds but the binary is unusable (broken postinstall, incompatible
          # Node, crash on invocation): under `bash -e` a bare `agnix --version`
          # in the `then` branch fails the whole job — the opposite of the
          # "clear skip, not a hard failure" acceptance above — and it would do
          # so having ALREADY written present=true, so a re-run of just the
          # downstream steps would scan with a binary known not to work.
          #
          # ONE pin literal, reused by both npm commands. Two literals in one
          # file would be a drift channel tests/lint-agnix-clean.sh cannot see:
          # its agnix_pin_in takes the FIRST `agnix@X.Y.Z` match and would never
          # compare it against the second.
          pin="agnix@0.49.0"
          verify_dir="$(mktemp -d)"

          # A failed signature check writes present=false on the SAME path as a
          # failed install — the scan and upload steps below are already gated on
          # that output, so an unverified agnix simply never scans. The message
          # is its own, not the notice below: "npm was unreachable" and "the
          # tarball npm served is not the one its publisher signed" are different
          # events, and a supply-chain signal must not read as an outage.
          if npm install --prefix "$verify_dir" --ignore-scripts "$pin" \
            && (cd "$verify_dir" && npm audit signatures); then
            # `--install-links` for the same reason as ci.yml's install (#766):
            # without it npm SYMLINKS the package into $verify_dir, and the
            # `rm -rf "$verify_dir"` that ends this step dangles the link. agnix
            # then resolves nowhere in the scan step below, which showed up as
            # `agnix produced no valid SARIF (crash or empty output)` on a green
            # job — the identical defect ci.yml had, reached by the other route.
            if npm install -g --install-links "$verify_dir/node_modules/agnix" && agnix --version; then
              echo "present=true" >> "$GITHUB_OUTPUT"
            else
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::notice::agnix install failed — skipping code-scanning upload (agnix is a best-effort enrichment; the check-ai-config floor still runs in the checker path)."
              # Surface it on the RUN PAGE too (#741), for the same reason and in
              # the same shape as ci.yml's install step. The two workflows share
              # this branch structure, so fixing the visibility in one and not the
              # other would leave the identical invisible skip alive by the other
              # route. `|| true`: reporting must never fail the job under `bash -e`.
              printf '%s\n' "> agnix unavailable: install or smoke-test failed for \`$pin\` — the code-scanning upload was SKIPPED." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::agnix signature verification failed — NOT installing agnix, skipping code-scanning upload (#740). Either npm was unreachable, or the tarball for $pin does not match its published registry signature."
            printf '%s\n' "> agnix unavailable: **signature verification failed** for \`$pin\` (#740) — npm was unreachable, or the tarball is not the one its publisher signed. The code-scanning upload was SKIPPED." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          fi
          rm -rf "$verify_dir"

      # Run agnix over the repo's OWN AI-config artifacts only:
      #   - `--config .agnix.toml` uses the repo's operator-controlled config
      #     (ADR §5 trust posture: never a config from an audited/foreign tree).
      #   - scope `CLAUDE.md AGENTS.md plugins` excludes the pinned containers/
      #     submodule (foreign tree) and .claude/memory scratch a bare `.` pulls in.
      #   - NO `--fix*` (ADR §4: autofix is fenced off the CI/checker path).
      #
      # Exit-code handling distinguishes the two non-zero cases, rather than a
      # blanket `|| true` that would treat a crash as a clean scan:
      #   - agnix exits non-zero when it FINDS issues — expected; the SARIF is
      #     still valid and must be uploaded (the annotations ARE the point).
      #   - agnix crashing (bad flag, panic, unparsable .agnix.toml, an
      #     incompatible version after a pin bump) leaves EMPTY or invalid SARIF.
      #     A blanket `|| true` there would silently read as "0 findings" forever
      #     with no signal (the failure mode the sibling agnix-normalize.py guards
      #     with its empty-output RuntimeError). So we validate the output: a
      #     non-empty, well-formed SARIF sets sarif=true (upload); anything else
      #     emits a ::warning:: and leaves sarif unset so the upload step skips —
      #     a clear skip, still not a hard job failure (informational gate).
      - name: Run agnix (SARIF)
        id: scan
        if: steps.agnix.outputs.present == 'true'
        run: |
          agnix --format sarif --target claude-code --config .agnix.toml \
            validate CLAUDE.md AGENTS.md plugins > agnix.sarif || true
          if [ -s agnix.sarif ] && jq -e '.runs' agnix.sarif >/dev/null 2>&1; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
            echo "agnix SARIF: $(jq '.runs[0].results | length' agnix.sarif) result(s)."
          else
            echo "::warning::agnix produced no valid SARIF (crash or empty output) — skipping code-scanning upload. This is a signal, not a clean scan; check the agnix step above."
          fi

      # Upload to GitHub code scanning. `category` is stable so GitHub dedups
      # findings across runs. Gated on a validated SARIF from the scan step, so
      # neither the install-failed skip nor an agnix crash reaches the upload.
      - name: Upload SARIF to code scanning
        if: steps.scan.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: agnix.sarif
          category: agnix
