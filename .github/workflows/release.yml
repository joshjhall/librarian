name: Release

# Fires when a vX.Y.Z tag is pushed (by bin/release.sh --auto-push or by hand).
# Validates the tagged tree with the same gates as CI, then publishes a GitHub
# Release whose notes are the matching CHANGELOG.md section. The published tag
# is what containers' LIBRARIAN_REF pins to (api.github.com/.../releases/latest).
on:
  push:
    tags:
      # Semver only — `bin/release.sh` tags `vX.Y.Z` (bin/lib/release/git-automation.sh).
      # Tag filters are glob patterns, not regex: `+` is one-or-more, `.` is literal, so
      # this requires a digit in each of three dot-separated segments and rejects stray
      # tags like `v`, `v0`, `v-test`, or `v1.2` that would otherwise fire the release.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Scope token permissions per job rather than workflow-wide: `validate` only
# reads the tree (checkout + the full `tests/run-all.sh` gate suite), while
# `publish` needs write to create the GitHub Release. Declaring write at the
# workflow level would let the read-only validate job inherit it, against least
# privilege.
jobs:
  validate:
    name: Validate tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Single entry point — tests/run-all.sh owns the full gate list (manifest
      # validation, structural lint, contract + behavioral gates, action-pin
      # format, release-toolchain coverage, …). Calling it here rather than
      # re-listing a hand-picked subset makes the release gate a strict superset
      # of what CI runs on a PR, so a tag can never publish from a tree the PR
      # suite would have rejected (issue #143). Mirrors ci.yml's quality-gates
      # job — same command, same anti-drift rationale.
      - name: Run test suite
        run: bash tests/run-all.sh

      - name: Assert VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file)"
            exit 1
          fi
          echo "VERSION ($file) matches tag ($GITHUB_REF_NAME)"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    # Headroom for the cosign keyless signing round-trip (OIDC → Fulcio cert →
    # Rekor log) plus the multi-asset upload, on top of the original publish work.
    timeout-minutes: 10
    # `id-token: write` lets cosign mint a short-lived OIDC token for keyless
    # signing (Fulcio issues a cert bound to this workflow's identity; Rekor
    # logs it) — no long-lived key to custody. `contents: write` publishes the
    # Release and its signed assets. Keyless signing FAILS without id-token.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # `git archive "$GITHUB_REF_NAME"` below needs the tag resolvable as a
          # local ref; make that explicit rather than relying on checkout's
          # implicit tag fetch.
          fetch-tags: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and sign release tarball
        id: sign
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="librarian-${version}.tar.gz"
          # Deterministic archive of the whole marketplace tree at the tag —
          # this is the "what bytes are signed" contract (see README ## Verifying
          # a release). Reproducible from the tag alone with the same command.
          git archive --format=tar.gz --prefix="librarian-${version}/" \
            -o "$tarball" "$GITHUB_REF_NAME"
          # Keyless: OIDC identity from this workflow, cert + signature to files.
          cosign sign-blob --yes "$tarball" \
            --output-signature "${tarball}.sig" \
            --output-certificate "${tarball}.pem"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: ${{ steps.sign.outputs.tarball }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Generate notes into a temp file and clean it up on exit. Folded into
          # this step (rather than a separate one handing the path off via
          # $GITHUB_OUTPUT) so the EXIT trap reliably removes it — mirrors the
          # mktemp+trap idiom in bin/lib/release/git-automation.sh.
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          bash bin/generate-release-notes.sh "$version" >"$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "$TARBALL" "${TARBALL}.sig" "${TARBALL}.pem"
