name: Release

# Fires when a vX.Y.Z tag is pushed (by bin/release.sh --auto-push or by hand).
# Validates the tagged tree with the same gates as CI, then publishes a GitHub
# Release whose notes are the matching CHANGELOG.md section. The published tag
# is what containers' LIBRARIAN_REF pins to (api.github.com/.../releases/latest).
on:
  push:
    tags:
      # Semver only — `bin/release.sh` tags `vX.Y.Z` (bin/lib/release/git-automation.sh).
      # Tag filters are glob patterns, not regex: `+` is one-or-more, `.` is literal, so
      # this requires a digit in each of three dot-separated segments and rejects stray
      # tags like `v`, `v0`, `v-test`, or `v1.2` that would otherwise fire the release.
      - "v[0-9]+.[0-9]+.[0-9]+"

# Scope token permissions per job rather than workflow-wide: `validate` only
# reads the tree (checkout + the full `tests/run-all.sh` gate suite), while
# `publish` needs write to create the GitHub Release. Declaring write at the
# workflow level would let the read-only validate job inherit it, against least
# privilege.
jobs:
  validate:
    name: Validate tagged tree (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # SHARDED to match ci.yml's quality-gates job. This job ran the whole of
    # tests/run-all.sh serially under a 15-minute cap and was CANCELLED mid-suite
    # on the v0.15.0 tag: the three shards cost 8m06s + 6m16s + 7m44s of stage
    # time on that same commit's PR run, so ~22 minutes of work could not fit in
    # 15 no matter how fast the runner was. `publish` needs this job, so the
    # cancellation skipped it — the tag existed with no Release, and containers'
    # LIBRARIAN_REF (releases/latest) stayed on the previous version.
    #
    # The cap was NOT the bug and is not what was raised here. It dates to #55,
    # when the serial suite still fit; #960 then split the stage list into
    # tests/shards/NN-<area>.sh and gave ci.yml a leg per shard, but this
    # workflow kept calling the serial entry point. So the two workflows
    # disagreed about how long the suite takes, and only the tag path could
    # notice. Sharding here restores the #143 property this job exists for —
    # that the release gate is a strict superset of the PR gate — by running the
    # suite the same WAY, not just the same command.
    #
    # Per CLAUDE.md: when a shard nears its cap, re-balance or add a shard;
    # do not nudge the number. Two earlier raises (15 -> 25 -> 40, #834/#932)
    # each surfaced as an opaque mid-stage cancellation in a stage unrelated to
    # the change that tripped it, which is exactly how this failure presented.
    #
    # fail-fast: false so one red shard does not cancel its siblings and turn a
    # single attributable failure into two opaque ones — same reason as ci.yml's.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 10-portability
          - 20-golem
          - 30-scanners
    # 20, mirroring ci.yml's per-shard cap and its derivation: the legs sit
    # within ~90s of each other, so this is ~3x headroom on every leg. The cap
    # bounds a HANG; it does not ration normal growth.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Match ci.yml's quality-gates toolchain so the release gate is a strict
      # superset of the PR gate (jq + shellcheck for the shell gates, ruff for
      # the Python lint gate) — otherwise those gates would skip-if-absent here
      # and a tag could publish Python/shell the PR suite would have linted.
      #
      # Routed through bin/apt-install.sh (#983) for the same reason as ci.yml's
      # copy: a bundled third-party source in the runner image must not be able
      # to fail an install of packages that do not come from it.
      - name: Install jq + shellcheck
        run: bash bin/apt-install.sh jq shellcheck

      # PINNED (#542) from ruff.toml's required-version via bin/ruff-version.sh,
      # same as ci.yml — a release must not be gated by a different ruff than the
      # PR was.
      # Resolved on its own line with an explicit `|| exit 1` for the same reason
      # as ci.yml's: an inline `$(...)` failure does not abort under `set -e`.
      - name: Install ruff
        run: |
          ruff_version="$(bash bin/ruff-version.sh)" || exit 1
          pipx install "ruff==$ruff_version"

      # Single entry point — tests/run-all.sh owns the full gate list (manifest
      # validation, structural lint, contract + behavioral gates, action-pin
      # format, release-toolchain coverage, …). Calling it here rather than
      # re-listing a hand-picked subset makes the release gate a strict superset
      # of what CI runs on a PR, so a tag can never publish from a tree the PR
      # suite would have rejected (issue #143). Mirrors ci.yml's quality-gates
      # job — same command, same anti-drift rationale.
      - name: Run test suite (shard ${{ matrix.shard }})
        run: bash tests/run-all.sh --shard ${{ matrix.shard }}

      - name: Assert VERSION matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag does not match VERSION ($file)"
            exit 1
          fi
          echo "VERSION ($file) matches tag ($GITHUB_REF_NAME)"

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    # Headroom for the cosign keyless signing round-trip (OIDC → Fulcio cert →
    # Rekor log) plus the multi-asset upload, on top of the original publish work.
    timeout-minutes: 10
    # `id-token: write` lets cosign mint a short-lived OIDC token for keyless
    # signing (Fulcio issues a cert bound to this workflow's identity; Rekor
    # logs it) — no long-lived key to custody. `contents: write` publishes the
    # Release and its signed assets. Keyless signing FAILS without id-token.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git archive "$GITHUB_REF_NAME"` below needs the tag resolvable as a
          # local ref; make that explicit rather than relying on checkout's
          # implicit tag fetch.
          fetch-tags: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and sign release tarball
        id: sign
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="librarian-${version}.tar.gz"
          # Deterministic archive of the whole marketplace tree at the tag —
          # this is the "what bytes are signed" contract (see README ## Verifying
          # a release). Reproducible from the tag alone with the same command.
          git archive --format=tar.gz --prefix="librarian-${version}/" \
            -o "$tarball" "$GITHUB_REF_NAME"
          # Keyless: OIDC identity from this workflow, signature + cert emitted as
          # a single Sigstore bundle. cosign 3.x defaults to --new-bundle-format,
          # which deprecated and IGNORES the old --output-signature/-certificate
          # flags (they silently produced no files → the v0.4.0 publish failed
          # with "create bundle file: open : no such file or directory"). The
          # bundle carries both the signature and the Fulcio cert; verification
          # consumes it via `cosign verify-blob --bundle` (see README ##
          # Verifying a release).
          cosign sign-blob --yes "$tarball" \
            --bundle "${tarball}.sigstore.json"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: ${{ steps.sign.outputs.tarball }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Generate notes into a temp file and clean it up on exit. Folded into
          # this step (rather than a separate one handing the path off via
          # $GITHUB_OUTPUT) so the EXIT trap reliably removes it — mirrors the
          # mktemp+trap idiom in bin/lib/release/git-automation.sh.
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          bash bin/generate-release-notes.sh "$version" >"$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "$TARBALL" "${TARBALL}.sigstore.json"
