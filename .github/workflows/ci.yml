name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this is a read-only validation pipeline (it checks out the
# tree and runs lint/test gates, posting only check statuses). Declare the
# minimal token scope at the workflow level so all jobs inherit it instead of
# the repository default, mirroring release.yml's explicit permissions block.
permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate manifests + action pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Fork-PR sandboxing (issue #52). This job runs the low-risk Node manifest
      # gate and the pure-bash action-pin gate UNCONDITIONALLY so fork PRs still
      # get that feedback (the shell suite in quality-gates is what we withhold).
      # But checkout pulls the PR HEAD, so on a fork those two gate scripts are
      # untrusted contributor code — running them as-is would let a poisoned
      # tests/validate-manifests.mjs (or tests/lint-action-pins.sh) execute
      # arbitrary code on the runner, reaching GITHUB_TOKEN / env / network.
      #
      # Defense: before running them, restore the TRUSTED main copies of exactly
      # the files we execute. Both gates read the repo (manifests, workflow YAML)
      # purely as data and import/source nothing outside this set —
      # validate-manifests.mjs uses only Node builtins; lint-action-pins.sh
      # sources only lib/harness.sh — so the trusted scripts still validate the
      # fork's actual manifests and action pins while the fork's edits to the
      # gate code itself cannot run. Same-repo PRs / push / dispatch are trusted
      # and skip this restore (the head.repo clause is null for non-PR events, so
      # the first clause keeps push + workflow_dispatch trusted). See issue #47
      # for the originating fork-execution hardening.
      - name: Restore trusted gate scripts (fork PRs)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          for f in tests/validate-manifests.mjs tests/lint-action-pins.sh tests/lib/harness.sh; do
            git show "FETCH_HEAD:${f}" > "${f}"
          done
          echo "::notice::Fork PR — manifest + action-pin gate scripts restored from origin/main before execution (issue #52)."

      - name: Validate marketplace + plugin manifests
        run: node tests/validate-manifests.mjs

      # Action-pin format gate on fork PRs too (issue #59). Pure bash, network-
      # free, reads only checked-out workflow files — the same low-risk profile
      # as the manifest gate above, and trusted-restored on forks by the step
      # above. Kept OUTSIDE the quality-gates fork guard so a fork PR that edits
      # .github/workflows/ is checked for unpinned/malformed action refs at PR
      # time, not only at release time (release.yml, post-merge).
      - name: Validate action pins
        run: bash tests/lint-action-pins.sh

  quality-gates:
    name: Skill/agent quality gates
    runs-on: ubuntu-latest
    needs: validate-manifests
    timeout-minutes: 15
    # Fork PRs check out untrusted contributor code as tests/* (checkout uses
    # the PR HEAD), so running the full shell suite would expose the runner —
    # network, environment, GITHUB_TOKEN — to it. Guard the WHOLE job (not just
    # the step) so a fork PR reports this job as `skipped` rather than a green
    # job with a silently-skipped step (issue #53): merge-gate below keys off
    # that skipped result. The first clause keeps push and workflow_dispatch
    # passing (their pull_request context is null, so the head.repo check alone
    # would wrongly skip them); fork PRs still get the lower-risk node manifest
    # + action-pin gates from validate-manifests. See issues #47 and #53.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # jq (contract gate) + shellcheck (tests/lint-shellcheck.sh). Both are on
      # the ubuntu runner image, but installing explicitly keeps the gate honest
      # if the image changes.
      - name: Install jq + shellcheck
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      # ruff powers tests/lint-python.sh (lint + format check of the Python
      # pre-scan tools). pipx is pre-installed on ubuntu-latest and puts ruff on
      # PATH, so the gate actually runs here rather than silently skipping.
      #
      # PINNED (#542) from ruff.toml's required-version via bin/ruff-version.sh —
      # unpinned, a new ruff release could fail `ruff format --check` here with no
      # code change behind it, and CI would disagree with a contributor's local
      # ruff for no visible reason.
      #
      # The pin is resolved on its own line with an explicit failure check, not
      # inline as `pipx install "ruff==$(...)"`. A failing command substitution
      # embedded in a larger command does NOT abort under `set -e` — only the
      # outer command's status counts — so a broken pin would degrade to
      # `pipx install "ruff=="` and surface as an incidental pipx argument error
      # instead of ruff-version.sh's own diagnostic. Mirrors the justfile's
      # `|| exit 1` guard.
      - name: Install ruff
        run: |
          ruff_version="$(bash bin/ruff-version.sh)" || exit 1
          pipx install "ruff==$ruff_version"

      # typos powers tests/lint-typos.sh. It was previously wired only into the
      # lefthook pre-push hook, so CI never spell-checked at all and a typo could
      # reach main by any path that skipped a local pre-push. Installed from the
      # release tarball rather than `cargo install` (which would build from source
      # and cost minutes) — the gate skips with sentinel 77 when typos is absent,
      # so without this step it would sit inert here.
      - name: Install typos
        run: |
          typos_version="1.48.0"
          url="https://github.com/crate-ci/typos/releases/download/v${typos_version}/typos-v${typos_version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin ./typos

      # agnix powers tests/lint-agnix-clean.sh, which asserts the repo's own
      # AI-config artifacts stay error-free (#734). That gate skips with sentinel
      # 77 when agnix is absent, so without this step it would sit inert here —
      # exactly the failure mode the typos step above was added to close.
      #
      # Pinned to the SAME version as .github/workflows/code-scanning.yml, and
      # for the same reason: agnix <= 0.47.0 emits dozens of phantom errors from
      # stale parsers, so a lower version would skip the gate rather than run it.
      # (Exact per-version counts live in the code-scanning.yml table; this file
      # deliberately keeps no copy of them.) The
      # two pins move together — see the FLOOR note in code-scanning.yml. Not
      # covered by dependabot (github-actions ecosystem only), so this is
      # deliberately a hand-edited number.
      #
      # Tolerating a failed install: unlike the three linters below, agnix is a
      # best-effort enrichment per ADR 0001 §2/§4 — a registry hiccup must leave
      # the gate skipping (77, rendered `[SKIP]`), never fail the whole CI job.
      # That is why it is absent from the PATH assertion that follows.
      #
      # But it does NOT swallow the failure silently. A bare `|| true` makes a
      # registry outage render downstream as `[SKIP] agnix error-free — did not
      # run`, which is indistinguishable from "agnix was never installed here on
      # purpose" — the reader has no breadcrumb back to this step. So the
      # failure branch emits an explicit `::notice::`, matching what
      # code-scanning.yml already does at its own install step.
      #
      # Signature verification (#740). The pin above fixes WHICH version npm
      # serves; it says nothing about whether the tarball npm serves for that
      # version is the one its publisher signed. `npm audit signatures` checks
      # the registry signature, so a tampered or substituted tarball is caught
      # before agnix runs against this repo's config.
      #
      # It cannot be appended after `npm install -g`: npm rejects the pairing
      # outright with `EAUDITGLOBAL: does not support global packages`. The audit
      # reads a package.json/package-lock.json pair, which only a LOCAL install
      # tree has. So verification happens in a throwaway prefix first, and the
      # global install is gated on it.
      #
      # `--ignore-scripts` on that scratch install is the load-bearing half. The
      # order is verify-THEN-install precisely so a tampered tarball's
      # `postinstall` never executes; letting scripts run during the scratch
      # install would run attacker code first and check the signature afterward,
      # which is the same as not checking it. tests/lint-agnix-clean.sh asserts
      # the flag is still there, because losing it leaves a check that looks
      # right and protects nothing.
      #
      # The global install then reads the VERIFIED DIRECTORY, not the registry:
      # `npm install -g --install-links "$verify_dir/node_modules/agnix"`. This
      # is the whole point of the sequence and is not interchangeable with
      # re-installing `"$pin"` globally. (`--install-links` copies rather than
      # symlinks so the install survives this step's cleanup — #766; it does not
      # reach the registry, so the guarantee below is unaffected.)
      #
      # Re-resolving `"$pin"` would be two independent fetches — the audit would
      # describe bytes the first fetch received while a second, unaudited fetch
      # supplied the bytes that actually run, and `-g` is where `postinstall`
      # executes. That is a TOCTOU window: registry immutability and cache reuse
      # usually close it, but "usually" is not a property a supply-chain check
      # should rest on, and nothing in the script enforces either. Installing the
      # verified tree makes the audited bytes and the installed bytes the same
      # bytes by construction, so the guarantee holds without that assumption.
      #
      # SCOPE OF THAT GUARANTEE, stated exactly because the general case is
      # weaker than it looks: `npm install -g --install-links <local-dir>` PACKS
      # the directory (measured — note that WITHOUT `--install-links` npm
      # symlinks instead and packs nothing, which is the #766 defect; this
      # comment and code-scanning.yml's twin disagreed on this point until #766
      # measured it), and a pack conventionally excludes `node_modules`. For a
      # package with runtime dependencies, npm would re-resolve that closure from
      # the registry — a second unaudited fetch, the same TOCTOU shape one level
      # down. agnix has NO dependencies of any kind (no `dependencies`,
      # `optionalDependencies`, or `peerDependencies`; its lockfile closure in
      # the scratch tree is the single entry `node_modules/agnix`), so the
      # audited closure and the installed closure are the same one package.
      # Confirmed empirically: `npm install -g --install-links --offline` from
      # the verified tree succeeds, which it could not do if any byte still had
      # to be fetched. Re-confirmed with `--install-links` when #766 added it.
      #
      # This is therefore a property of agnix, not of the pattern. Should agnix
      # ever gain a dependency, this reasoning stops holding and the step needs
      # revisiting — reuse the same `--offline` check to tell, since it fails
      # loudly the moment something must be fetched.

      # Cache agnix's POSTINSTALL BINARY (#742). Measured, because the obvious
      # reading of "cache the npm install" targets the wrong layer entirely:
      # agnix's npm tarball is 17 KB (dist.unpackedSize=17676) and a warm npm
      # cache saves ~85 ms on it, while its `postinstall` (install.js) fetches a
      # 3.6 MB archive — 8.5 MB extracted — from github.com/agent-sh/agnix
      # releases, which is NOT the npm registry and which no npm-level cache
      # covers. So ~98% of the bytes, and effectively all of the network-latency
      # variance the issue was filed about, live here.
      #
      # `actions/setup-node`'s own `cache: npm` cannot do this job for a second,
      # independent reason: it derives its key from a lockfile, and this repo has
      # no root package.json/package-lock.json at all.
      #
      # THE SEAM: install.js returns early when `bin/agnix-binary` already
      # exists ("agnix binary already installed"), and agnix's `files:` array
      # includes `bin/`, so a binary seeded into the verified scratch tree is
      # carried through by `npm install -g --install-links
      # "$verify_dir/node_modules/agnix"` and the download never happens.
      # Verified empirically in both directions: a seeded tree short-circuits,
      # an unseeded one downloads. Re-verified after #766 added
      # `--install-links` — the copy carries the seeded binary just as the
      # symlink did, so the cache-HIT path is unaffected by that change.
      #
      # NO `restore-keys`, deliberately. A prefix fallback could restore a
      # DIFFERENT version's binary under a bumped pin — precisely the drift the
      # pin exists to prevent. A miss must be a clean miss.
      #
      # CACHE ENTRIES ARE IMMUTABLE, and that shapes the recovery story below.
      # actions/cache does not create a new entry when the primary key already
      # matches ("If the provided `key` matches an existing cache, a new cache
      # is not created"), and the post-job save is skipped outright on an exact
      # hit. So NOTHING the install step does can repair a persisted entry whose
      # blob has gone bad: the script can discard the local copy and re-download
      # for THIS run, but the remote entry under this key stays as it is.
      #
      # The consequence is bounded and non-fatal — a corrupt entry degrades this
      # job to "download every run", which is exactly where it was before this
      # change, with an extra digest check. It is not a broken build.
      #
      # RECOVERY IS A KEY BUMP, and it is manual on purpose. Appending a
      # generation counter here (`-g2`) invalidates the bad entry and costs one
      # cold run. The documented alternative — a per-run unique key plus
      # `restore-keys` — would make saves always write, but it burns cache quota
      # on every run and reintroduces the prefix-fallback drift this key
      # deliberately avoids. Not worth it for an event this rare.
      #
      # The key carries the BARE version (`0.49.0`), never the pinned-spec form
      # that the install step below uses. tests/lint-agnix-clean.sh's
      # agnix_pin_in greps the FIRST pinned-spec match in the file — over the
      # whole file, comments included — and compares it against
      # code-scanning.yml's. Any earlier occurrence of that spelling, in a
      # comment as readily as in code, would shadow the real pin: bump the
      # install step alone and the gate would keep reporting the OLD version and
      # still pass, which is precisely the cross-workflow drift it exists to
      # catch. Hence the bare version here, and no example of the pinned spelling
      # anywhere in this comment. (Same reason the install step keeps ONE pin
      # literal for its two npm commands.)
      #
      # This key must be bumped in lockstep with that pin. Leaving it stale is
      # not merely untidy: the old key would restore the PREVIOUS version's
      # binary, install.js would find bin/agnix-binary present and skip its
      # download, and the job would silently run the wrong agnix — green, and
      # wrong. The smoke test below is the backstop that turns that into a
      # visible skip rather than a bad scan — but only because it GREPS the
      # pinned version out of `agnix --version` rather than merely running the
      # binary. A bare run would accept a functional older agnix and prove
      # nothing about which one it is.
      - name: Restore cached agnix binary
        id: agnix-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agnix-bin
          # runner.arch is in the key because the release asset is
          # arch-specific (x86_64 vs aarch64) — a shared key would hand an
          # unrunnable binary to the other architecture.
          key: agnix-bin-${{ runner.os }}-${{ runner.arch }}-0.49.0

      - name: Install agnix (pinned)
        id: agnix-install
        # No `env:` bridge for the cache-hit output on purpose. An earlier draft
        # passed `steps.agnix-cache.outputs.cache-hit` in and branched the save
        # on it, but that output answers "did the KEY exist?", not "is the
        # cached binary usable?" — and those diverge exactly when the entry is
        # corrupt, where the difference silently disables the cache forever
        # after. The script derives what it needs from the digest check itself
        # ($agnix_cache_usable below), so the workflow-expression bridge is not
        # merely unused here, it would be the wrong signal to reach for.
        run: |
          # BOTH commands sit in the condition, deliberately. A `run:` step
          # executes under `bash -e`, so an `agnix --version` placed inside the
          # `then` branch would abort the step — and fail the whole job — when
          # the install SUCCEEDS but the binary is unusable (a broken postinstall,
          # an incompatible Node, a crash on invocation). That is the exact
          # outcome the comment above promises cannot happen, and it is the
          # likelier half of the failure space: a registry outage is caught by
          # the `if`, a bad install is not. Folding the smoke-test into the
          # condition routes both to the same notice-and-skip path.
          #
          # ONE pin literal, reused by both npm commands. Two literals in one
          # file would be a drift channel tests/lint-agnix-clean.sh cannot see:
          # its agnix_pin_in takes the FIRST `agnix@X.Y.Z` match and would never
          # compare it against the second.
          pin="agnix@0.49.0"
          verify_dir="$(mktemp -d)"

          # Signature failure gets its OWN message, not the notice below. "npm
          # was unreachable" and "the tarball npm served is not the one its
          # publisher signed" are different events, and a supply-chain signal
          # must not read as an outage. Still a warning rather than a failure:
          # agnix is a best-effort enrichment, so the gate skips (77) either way.
          if npm install --prefix "$verify_dir" --ignore-scripts "$pin" \
            && (cd "$verify_dir" && npm audit signatures); then
            # Seed the cached binary into the VERIFIED tree, between the
            # signature gate and the global install (#742). Placement is exact:
            # after `npm audit signatures` so nothing here can weaken that
            # check, and before the global install so install.js finds
            # bin/agnix-binary already present and skips its 3.6 MB download.
            #
            # SCOPE OF THE #740 GUARANTEE, NARROWED — stated plainly because the
            # comment block above claims the audited bytes and the installed
            # bytes are "the same bytes by construction", and seeding adds bytes
            # that npm never audited. What still holds: every byte of the npm
            # PACKAGE is signature-verified, and the binary is exactly what a
            # previous run of this same job downloaded and checksum-verified via
            # install.js's own sha256 sidecar check. What changes: on a cache
            # hit the binary is NOT re-verified against the publisher's
            # checksum, because install.js short-circuits before fetching the
            # sidecar. Its provenance rests instead on the cache key
            # (os + arch + version) and on who could have written that entry.
            #
            # WHAT THE sha256 RE-CHECK BELOW IS AND IS NOT. Both sides of that
            # comparison are written by this same job, so it detects corruption
            # and truncation — NOT cache poisoning. An attacker able to write
            # this key could store a malicious binary alongside a matching
            # digest and it would verify happily. Do not read the digest check
            # as a supply-chain guarantee; it is a cheap guard against a damaged
            # blob.
            #
            # What actually bounds poisoning is GitHub's cache scoping. Stated
            # exactly, from GitHub's dependency-caching reference (an earlier
            # draft of this comment paraphrased it wrongly, so prefer checking
            # that page over trusting this summary):
            #
            #   - A run restores from its own ref, from the default branch, and
            #     — for a pull_request run — from its base branch. Sibling and
            #     CHILD branches are not readable, so an entry written on a
            #     topic branch is invisible to a run on main.
            #   - A pull_request run's writes are scoped to the merge ref
            #     (refs/pull/N/merge), restorable only by re-runs of that PR.
            #   - Only push, workflow_dispatch, repository_dispatch, delete,
            #     registry_package, page_build and schedule may create or
            #     overwrite entries in the default branch's scope. Every other
            #     event resolving to the default branch gets READ-ONLY access —
            #     pull_request_target, issue_comment and workflow_run are the
            #     named examples. GitHub calls this threat cache poisoning
            #     directly.
            #
            # Together those are why a fork PR cannot reach the entry a later
            # run on main restores.
            #
            # Isolation is not confidentiality, and that cuts the other way:
            # anyone who can open a PR against this repo can READ base-branch
            # cache contents. That is fine for an agnix binary, which is a
            # public release artifact — but it is the reason nothing secret may
            # ever be added to this cached path.
            #
            # Nor is the job's `contents: read` a containment story. That scopes
            # the GITHUB_TOKEN's API reach; it does nothing to constrain a
            # binary already executing on the runner, which can still read the
            # job's environment and make outbound requests. What genuinely makes
            # the trade acceptable here is narrower: this job holds no secrets
            # beyond that token, and it cannot write code-scanning results.
            #
            # code-scanning.yml is the job where that stops being true — it
            # holds `security-events: write`, so a poisoned binary there could
            # forge or suppress security findings, and actions/setup-node's docs
            # warn a poisoned cache can expose credentials and OIDC tokens to
            # attacker-controlled code. It is deliberately left uncached and
            # always downloads a freshly checksum-verified binary. Do not
            # "unify" the two workflows by copying this block over; the
            # asymmetry is the point.
            #
            # Tracks whether the cache actually yielded a USABLE binary, which
            # is a different question from `cache-hit`: that output reports only
            # that the KEY existed at restore time, never that the content was
            # intact. Keying the staging step below on content rather than on
            # key presence keeps the local ~/.cache/agnix-bin coherent with the
            # binary this run actually installed.
            #
            # WHAT THIS DOES NOT DO — stated plainly, because an earlier draft
            # of this very comment claimed the opposite and was wrong. It does
            # NOT make a corrupted cache self-healing. Cache entries are
            # immutable and the post-job save is skipped on an exact key hit
            # (see the cache step above), so a bad blob under this key survives
            # no matter what this script writes locally. Recovery is a manual
            # key bump; the failure mode meanwhile is "downloads every run",
            # not a broken build.
            agnix_cache_usable=0
            cached_bin="$HOME/.cache/agnix-bin/agnix-binary"
            if [ -f "$cached_bin" ] && [ -f "$cached_bin.sha256" ]; then
              # Re-check the restored bytes against the digest stored beside
              # them — a CORRUPTION check, not an authenticity one (see the
              # block above: this job wrote both sides, so it cannot detect a
              # poisoned entry; cache scoping is what bounds that).
              # FAIL-SAFE, not fail-closed: a mismatch discards the cache
              # and falls through to a normal download, because agnix is a
              # best-effort enrichment (ADR 0001 §2/§4) and a corrupt cache must
              # not red this job. `cut -d' ' -f1` because sha256sum prints
              # "<digest>  <path>" and the stored path is not the current one.
              want="$(cut -d' ' -f1 <"$cached_bin.sha256")"
              got="$(sha256sum "$cached_bin" | cut -d' ' -f1)"
              if [ "$want" = "$got" ]; then
                # The seeding copy is CHAINED and absorbed, not bare. Under
                # `bash -e` a bare `cp`/`chmod` here would fail the whole job if
                # the destination bin/ were missing or the copy failed for any
                # transient reason (permissions, disk) — turning a cache
                # optimization into a red build and contradicting the
                # best-effort contract this step is built around. The `|| true`
                # sends any such failure down the ordinary download path
                # instead, with agnix_cache_usable left 0 so the staging block
                # below still repopulates the directory.
                if cp "$cached_bin" "$verify_dir/node_modules/agnix/bin/agnix-binary" \
                  && chmod +x "$verify_dir/node_modules/agnix/bin/agnix-binary"; then
                  agnix_cache_usable=1
                  echo "agnix binary restored from cache (sha256 $got)"
                else
                  echo "::notice::could not seed the cached agnix binary — falling back to a fresh download."
                fi
              else
                echo "::notice::cached agnix binary failed its sha256 re-check — discarding and downloading fresh."
                rm -f "$cached_bin" "$cached_bin.sha256"
              fi
            fi
            # The smoke test compares the version rather than merely running the
            # binary. `agnix --version` alone proves only that SOMETHING
            # executes, which is not the property the cache needs: a stale entry
            # holding a functional OLDER binary passes that check happily,
            # install.js skips its download because bin/agnix-binary exists, and
            # the job scans with an agnix it did not pin — green, and wrong.
            # Grepping for the pinned version closes that gap, and does it on
            # the path that matters, since the drift gate in
            # tests/lint-agnix-clean.sh can only catch a mismatch someone WROTE,
            # never a stale blob sitting in the remote cache.
            #
            # `${pin#agnix@}` reuses the single pin literal rather than adding a
            # second copy of the version — the drift channel this file works
            # hard to avoid. A mismatch takes the same notice-and-skip path as a
            # failed install: the gate SKIPs (77), the job stays green.
            # `--install-links` is what makes this install SURVIVE (#766).
            # Without it `npm install -g <local-dir>` SYMLINKS the directory:
            # `npm root -g`/agnix becomes a link into $verify_dir, and the
            # `rm -rf "$verify_dir"` that ends this step dangles it. agnix then
            # resolves nowhere by the time the test suite runs two steps later,
            # so tests/lint-agnix-clean.sh took its absent-binary 77 skip and
            # reported `[SKIP] … did not run` on a GREEN job — for weeks.
            #
            # The failure was invisible precisely because this step SUCCEEDS.
            # The install works, the smoke test passes, no notice is emitted;
            # the breakage happens afterward, in the cleanup, to a consumer this
            # step cannot see. Do not read a passing install here as proof that
            # agnix is available downstream — that inference is what #766 was.
            #
            # `--install-links` makes npm COPY the package instead, so the
            # global tree is a real directory that outlives $verify_dir.
            # Verified: `agnix --version` prints the pin both before and after
            # the cleanup, where the symlinked install printed
            # `command not found` after it.
            #
            # It does NOT weaken the #740 guarantee: `npm install -g
            # --install-links --offline` from the verified tree succeeds, which
            # it could not do if any byte still had to be fetched. The audited
            # bytes remain the installed bytes. (That is the same `--offline`
            # probe code-scanning.yml's comment nominates for this question —
            # reuse it if agnix ever gains a dependency.)
            if npm install -g --install-links "$verify_dir/node_modules/agnix" \
              && agnix --version | grep -qF "${pin#agnix@}"; then
              # Record that agnix genuinely installed, for the did-the-gate-run
              # assertion after the suite (#766). Written on the success branch
              # only, so an outage/fork/skip leaves it unset and the assertion
              # stays quiet — agnix remains best-effort (ADR 0001 §2/§4).
              echo "installed=true" >> "$GITHUB_OUTPUT"
              # Populate the cache on a miss, reading from the GLOBAL install
              # root rather than from $verify_dir. That is load-bearing, not
              # stylistic, and it is the half of #766 that would otherwise
              # regress silently.
              #
              # `--install-links` (added above) makes `npm install -g
              # <local-dir>` COPY the package. The postinstall therefore runs
              # against the COPY and writes bin/agnix-binary into `npm root -g`,
              # NOT into $verify_dir. An earlier revision of this block read
              # $verify_dir, which was correct only while the install symlinked;
              # left unchanged it would find no file, take the `-f` guard's
              # silent no-op branch, and quietly stop populating the cache —
              # green, and never a cache hit again.
              #
              # What still holds: the file read here is exactly the binary
              # install.js just downloaded and verified against the publisher's
              # .sha256 sidecar, so the cache is seeded with checksum-verified
              # bytes rather than something scavenged from elsewhere. What
              # changes: the copy outlives the `rm -rf` below, so unlike the old
              # symlink path this read has no ordering coupling to the cleanup
              # at all.
              #
              # The install also passed `agnix --version` just above, so a binary
              # is only ever cached after being proven to run on this runner.
              #
              # Guarded on CONTENT, not on key presence: skip the write only
              # when the restore actually produced a verified binary, since the
              # file on disk is then already what we would write.
              #
              # The case that makes content the right test is the CACHE MISS
              # AFTER A CORRUPT RESTORE. There, the digest check has deleted the
              # local files, so a `cache-hit`-keyed guard would skip staging and
              # leave ~/.cache/agnix-bin EMPTY while a perfectly good binary sat
              # in the global install root — the on-disk state would then
              # disagree with the binary this job actually installed.
              #
              # Be clear about the limit, though: staging here only prepares the
              # directory for the post-job save. On an exact key hit that save
              # is skipped and the entry is immutable regardless (see the cache
              # step above), so this does NOT repair a bad remote entry — it
              # keeps the local state honest and lets a MISS populate the key
              # correctly. Repairing a corrupt entry means bumping the key.
              #
              # Trailing `|| true`: this is an OPTIMIZATION, and under `bash -e`
              # a failed copy must never convert a working agnix install into a
              # failed CI job.
              if [ "$agnix_cache_usable" != "1" ]; then
                staged_bin="$(npm root -g)/agnix/bin/agnix-binary"
                if [ -f "$staged_bin" ]; then
                  mkdir -p "$HOME/.cache/agnix-bin" \
                    && cp "$staged_bin" "$HOME/.cache/agnix-bin/agnix-binary" \
                    && sha256sum "$HOME/.cache/agnix-bin/agnix-binary" \
                      >"$HOME/.cache/agnix-bin/agnix-binary.sha256" \
                    && echo "agnix binary staged for cache save" || true
                fi
              fi
            else
              echo "::notice::agnix install failed — tests/lint-agnix-clean.sh will SKIP (exit 77), not fail. agnix is a best-effort enrichment (ADR 0001 §2/§4); the rest of the suite still gates this job."
              # Also surface it on the RUN PAGE (#741). A ::notice:: lives in log
              # output nobody scrolls on a green run, so a gate that has silently
              # stopped running for weeks reads exactly like one that keeps
              # passing — the confusion the 77 sentinel exists to end, arriving at
              # the surface one level out. `|| true` for the same reason
              # run-all.sh's own emission carries it: this is REPORTING, and a
              # read-only or full summary file must never convert a skipped gate
              # into a failed job (the step runs under `bash -e`).
              #
              # `2>/dev/null` BEFORE the append, matching run-all.sh's
              # note_skip_in_step_summary. Redirections apply left to right, so
              # the usual `>> "$f" 2>/dev/null` spelling opens the file first and
              # a failed open writes its diagnostic to the stderr still in
              # effect — absorbing the failure but not its noise, which puts a
              # spurious error in the job log of an otherwise fine run.
              printf '%s\n' "> agnix unavailable: install or smoke-test failed for \`$pin\` — \`tests/lint-agnix-clean.sh\` will SKIP." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
            fi
          else
            echo "::warning::agnix signature verification failed — NOT installing agnix (#740). Either npm was unreachable, or the tarball for $pin does not match its published registry signature. tests/lint-agnix-clean.sh will SKIP (exit 77), not fail."
            # Its own summary line, matching its own message: an unsigned tarball
            # and an unreachable registry are different events, and a
            # supply-chain signal must not render as an outage (#740).
            printf '%s\n' "> agnix unavailable: **signature verification failed** for \`$pin\` (#740) — npm was unreachable, or the tarball is not the one its publisher signed. \`tests/lint-agnix-clean.sh\` will SKIP." 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          fi
          rm -rf "$verify_dir"

      # Fail loudly if a required linter did not land on PATH — otherwise the
      # skip-if-absent gates would quietly no-op in CI, defeating their purpose.
      # agnix is deliberately NOT asserted here (see its install step above).
      - name: Verify linters are on PATH
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck missing on PATH"; exit 1; }
          command -v ruff >/dev/null || { echo "ruff missing on PATH"; exit 1; }
          command -v typos >/dev/null || { echo "typos missing on PATH"; exit 1; }
          shellcheck --version | head -1
          ruff --version
          typos --version

      # Single entry point — tests/run-all.sh owns the stage list (structural
      # lint, contract validation, behavioral gates, action-pin format, and a
      # re-run of manifest validation). Calling it here instead of re-listing
      # each gate keeps CI from drifting out of sync with the local `just test`
      # suite when a stage is added or renamed.
      - name: Run test suite
        run: bash tests/run-all.sh

      # DID THE agnix GATE ACTUALLY RUN? (#766)
      #
      # The bug this closes was invisible for weeks: tests/lint-agnix-clean.sh
      # reported `[SKIP] … did not run`, the job stayed GREEN, and a skip reads
      # as "agnix is optional here" rather than "the gate you added stopped
      # working". Sentinel 77 makes a skip legible in the log; it cannot make
      # anyone LOOK at the log of a passing run. This step is the signal that
      # does not need a reader.
      #
      # Deliberately NOT part of "Verify linters are on PATH" above. That step
      # asserts a HARD requirement, and agnix is a best-effort enrichment (ADR
      # 0001 §2/§4) — a registry outage or a network-restricted runner must
      # still skip, not red the build. So the condition is not "is agnix
      # present" but "did agnix install successfully AND the gate still not
      # run" — a combination that is always a defect, and exactly the #766
      # state. When the install did not succeed, `installed` is unset, this
      # step does not run, and the skip stays legitimate.
      #
      # Re-running the gate is what makes this a real check rather than log
      # scraping: its exit code IS the answer (77 = did not run), it is
      # side-effect free, and it costs a second on a tree the suite already
      # validated. Grepping run-all.sh's output for a skip line would couple
      # this to that renderer's wording, which is precisely the kind of
      # prose-anchored assertion that rots.
      - name: Assert the agnix gate actually ran
        if: steps.agnix-install.outputs.installed == 'true'
        run: |
          # `rc=""` first, then `${rc:-0}`: the step runs under `bash -e`, where
          # a non-zero exit must be captured with `|| rc=$?` rather than read
          # after the fact. Initialising explicitly keeps the fallback about THIS
          # run's exit code rather than about whatever `rc` might already hold.
          rc=""
          bash tests/lint-agnix-clean.sh >/dev/null 2>&1 || rc=$?
          rc="${rc:-0}"
          if [ "$rc" = "77" ]; then
            echo "::error::agnix installed successfully, but tests/lint-agnix-clean.sh still reported SKIP (exit 77) — the gate is inert (#766). This is the failure that hid behind a green job for weeks: check that the global install survives this job's own 'rm -rf \$verify_dir' (it needs --install-links)."
            exit 1
          fi
          echo "agnix gate ran (exit $rc)."

  # Coverage reporting (issue #186). INFORMATIONAL, never a merge gate: this job
  # is deliberately absent from merge-gate's `needs:` below, and codecov.yml
  # marks every status informational, so a coverage regression or a Codecov
  # outage cannot red the PR. Scope is Python (EVERY .py we ship — the patterns.py
  # ports plus the non-port tools, coverage.py -> coverage.xml; the corpus is kept
  # complete by tests/validate-coverage-corpus.sh, #748) + the .mjs validators
  # (c8 -> lcov). The bash patterns.sh
  # fallback is NOT measured — line coverage is instrument noise for its
  # grep-pipeline detection (see CLAUDE.md runtime policy). Runs on maintainer
  # push and same-repo PRs; skipped for fork PRs, which lack the CODECOV_TOKEN
  # secret (fork secrets are withheld by GitHub) — same trust boundary as
  # quality-gates.
  coverage:
    name: Coverage (python + mjs) → Codecov
    runs-on: ubuntu-latest
    needs: validate-manifests
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # ubuntu-latest ships python3>=3.11; install coverage.py (the primary
      # patterns.py runtime is Python 3.11+, so this matches CLAUDE.md's floor).
      # pipx is pre-installed and puts `coverage` on PATH.
      - name: Install coverage.py
        run: pipx install coverage

      # coverage.xml — every Python file we ship, under coverage.py. The count is
      # NOT restated here: the script prints `N ports run` and
      # tests/validate-coverage-corpus.sh enforces that N is all of them. A number
      # in this comment drifted from 14 to 17 without anyone noticing (#748), which
      # is what a comment asserting a derivable fact always eventually does.
      #
      # COVERAGE_PYTHON_REQUIRED=1 makes a skip FATAL here. This job installs
      # coverage one step above, so "coverage.py not installed" is a broken runner,
      # not an unequipped host. Without it the script skipped on EVERY run — pipx
      # installs into an isolated venv that `python3 -m coverage` cannot see — and
      # exited 0, so the step was green, the job was green, and Codecov silently
      # received nothing under the `python` flag (#748). The flag is what makes
      # that state loud instead of invisible.
      - name: Python coverage
        env:
          COVERAGE_PYTHON_REQUIRED: "1"
        run: bash tests/coverage-python.sh

      # coverage/lcov.info — the two .mjs validators via `npx c8`.
      - name: mjs coverage
        run: bash tests/coverage-mjs.sh

      # Upload the Python report under the `python` flag. fail_ci_if_error:false
      # so a missing token / transient Codecov error stays non-fatal (#186
      # acceptance: informational until a baseline lands). The token is a repo
      # secret the maintainer must set; until then this step no-ops gracefully.
      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: javascript
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # BSD/macOS regex probe (issue #684). INFORMATIONAL, never a merge gate:
  # deliberately absent from merge-gate's `needs:` below, same posture as the
  # coverage job.
  #
  # WHY IT EXISTS. #679 swept GNU-only regex out of the shell scanners because
  # BSD grep/sed read `\s`/`\w`/BRE `\|` as literals — the pattern stops matching,
  # the scanner emits zero rows, and the scan still exits 0, so macOS sees a clean
  # report of nothing. One construct was left out of that ban on purpose: `\b`,
  # used at 38 sites. The belief that modern BSD `grep -E` supports it had never
  # been checked on a BSD host, only asserted, and #679 declined to change 38
  # sites on an assumption. This job is what turns that into evidence: it is the
  # repo's ONLY BSD userland, and its output decides whether `\b` becomes a
  # documented exemption in lint-shell-portability.sh or those sites get ported
  # to POSIX `grep -w`.
  #
  # WHY NOT THE FULL SUITE. Running tests/run-all.sh here would be the obvious
  # move and is deliberately not done. Its ~60 stages have never run under BSD
  # userland, and the test scripts themselves are not held to the portability
  # rules they enforce on plugins/ — so a full leg would fail broadly on its own
  # GNU-isms, plus missing shellcheck/ruff/typos, and the noise would bury the
  # one signal this job exists to produce. Scope is the probe plus the python
  # port parity gate (whose contract is bash<->python byte equality — worth
  # confirming under a second userland, and the gate self-skips cleanly when its
  # runtime is absent).
  #
  # NON-BLOCKING BY DESIGN, for now. This is the first BSD exposure in the repo's
  # history; a surprise here must not red unrelated PRs. Once the `\b` question
  # is settled and the probe has run clean for a while, promoting it into
  # merge-gate's `needs:` is the natural follow-up.
  #
  # Fork PRs are skipped on the same trust boundary as quality-gates: checkout
  # pulls the PR HEAD, so tests/probe-bsd-regex.sh would be untrusted
  # contributor code executing on the runner.
  #
  # COST, ACCEPTED DELIBERATELY. macOS runners bill at a higher multiplier than
  # Linux (~10x), and this job has no path filter, so it runs on every same-repo
  # push/PR including ones touching only docs. That is a considered trade, not an
  # oversight:
  #
  #   - A per-job `paths:` filter does not exist in Actions — `paths` is a
  #     workflow-level `on:` key, so scoping this one job would mean splitting it
  #     into its own workflow file. A step-level changed-files check would not
  #     help either: billing starts at runner spin-up, which has already happened
  #     by the time any step can decide to skip.
  #   - The work is a handful of `grep`/`sed` invocations plus one parity gate —
  #     seconds of compute. `timeout-minutes: 5` caps the exposure of a hang at
  #     roughly a Linux job's typical run, and this repo is public (where GitHub
  #     does not bill Actions minutes at all).
  #   - Running it everywhere is also the point: a BSD regression can be
  #     introduced by a change to any scanner, and a path filter narrow enough to
  #     save meaningful minutes would be wide enough to miss one.
  #
  # If the cost ever does bite, the fix is a separate workflow file with
  # `on.pull_request.paths` — not a step-level guard.
  bsd-probe:
    name: BSD/macOS regex probe (informational)
    runs-on: macos-latest
    needs: validate-manifests
    timeout-minutes: 5
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Record which userland actually ran, so a future reader can tell whether a
      # given result came from BSD or from a GNU coreutils that leaked onto PATH
      # (homebrew's `gnubin`). BSD grep/sed have no --version and exit non-zero
      # on it, which is itself the signal — hence the `|| true`.
      - name: Identify the userland
        run: |
          sw_vers || true
          echo "--- grep ---"; command -v grep; grep --version 2>&1 | head -1 || true
          echo "--- sed  ---"; command -v sed;  sed  --version 2>&1 | head -1 || true

      # The probe fails (exit 1) only if a POSIX baseline construct — the
      # spellings #679 migrated TO — does not hold here. That would mean the
      # sweep itself is broken on macOS and is worth failing this job over. The
      # word-boundary rows are informational and never fail it.
      - name: Probe regex dialects
        run: bash tests/probe-bsd-regex.sh

      - name: Python-port contract + bash parity
        run: bash tests/validate-python-ports.sh

  # Aggregating gate (issue #53). A skipped step does not fail its job, and a
  # skipped JOB reports neither success nor failure — so without this, a fork PR
  # (quality-gates skipped) would leave no single check that means "everything
  # that should have run, ran and passed". merge-gate consumes both upstream
  # results via `needs` + `if: always()` (so it runs even when quality-gates is
  # skipped or a dependency failed) and is the safe candidate for a required
  # branch-protection check.
  #
  # Pass conditions:
  #   - validate-manifests must have succeeded (it runs on every event); AND
  #   - quality-gates must have succeeded, OR been legitimately skipped because
  #     this is a fork PR (the shell suite is withheld from forks by design;
  #     it runs on maintainer push to an in-repo branch and at release time).
  # Any other state — a real failure, a cancellation, or quality-gates skipped
  # on a NON-fork event — fails the gate.
  #
  # Org-member-fork edge: a PR from an org member's personal fork has
  # head.repo.full_name != github.repository, so it is treated as external and
  # its suite is skipped (with the ::notice:: below). That is the conservative
  # choice — distinguishing trusted org members would require extra token scope
  # (org membership lookup) and is out of scope. A maintainer revalidates such a
  # PR by pushing the branch into this repo, which runs the full suite.
  #
  # No checkout / no actions are used here on purpose: the job only reads
  # `needs.*.result`, so it adds no new `uses:` ref for the action-pin gate.
  merge-gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [validate-manifests, quality-gates]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require upstream gates to have passed (or legitimately skipped)
        # Pass results through env, never interpolated into the shell, to keep
        # the check injection-safe.
        env:
          MANIFESTS_RESULT: ${{ needs.validate-manifests.result }}
          QUALITY_RESULT: ${{ needs.quality-gates.result }}
          IS_FORK_PR: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          echo "validate-manifests: ${MANIFESTS_RESULT}"
          echo "quality-gates:      ${QUALITY_RESULT}"
          echo "fork PR:            ${IS_FORK_PR}"

          if [ "${MANIFESTS_RESULT}" != "success" ]; then
            echo "::error::validate-manifests did not succeed (${MANIFESTS_RESULT})."
            exit 1
          fi

          if [ "${QUALITY_RESULT}" = "success" ]; then
            echo "All required gates passed."
            exit 0
          fi

          if [ "${QUALITY_RESULT}" = "skipped" ] && [ "${IS_FORK_PR}" = "true" ]; then
            echo "::notice::quality-gates shell suite is skipped for fork PRs by design (issue #47); it runs on maintainer push to an in-repo branch and at release time. Manifest + action-pin gates did run."
            exit 0
          fi

          echo "::error::quality-gates result '${QUALITY_RESULT}' is not acceptable for this event."
          exit 1
