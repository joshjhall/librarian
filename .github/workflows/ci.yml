name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this is a read-only validation pipeline (it checks out the
# tree and runs lint/test gates, posting only check statuses). Declare the
# minimal token scope at the workflow level so both jobs inherit it instead of
# the repository default, mirroring release.yml's explicit permissions block.
permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate marketplace + plugin manifests
        run: node tests/validate-manifests.mjs

  quality-gates:
    name: Skill/agent quality gates
    runs-on: ubuntu-latest
    needs: validate-manifests
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Single entry point — tests/run-all.sh owns the stage list (structural
      # lint, contract validation, behavioral gates, and a re-run of manifest
      # validation). Calling it here instead of re-listing each gate keeps CI
      # from drifting out of sync with the local `just test` suite when a stage
      # is added or renamed.
      # Fork PRs check out untrusted contributor code as tests/* (checkout uses
      # the PR HEAD), so running the full shell suite would expose the runner —
      # network, environment, GITHUB_TOKEN — to it. Run the suite only for
      # same-repo PRs, push, and workflow_dispatch. The first clause keeps push
      # and workflow_dispatch passing (their pull_request context is null, so the
      # head.repo check alone would wrongly skip them); fork PRs still get the
      # lower-risk node manifest validation from the validate-manifests job. See
      # issue #47.
      - name: Run test suite
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: bash tests/run-all.sh
