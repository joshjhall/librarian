# Dependabot — keep pinned GitHub Actions SHAs (and their `# vX.Y.Z` comments)
# in sync. The workflows pin every action to a full commit SHA with a trailing
# version comment (see CLAUDE.md § Key conventions and tests/lint-action-pins.sh).
# Dependabot bumps the SHA *and* the comment atomically in one PR, so the two
# never drift — the gap this config closes.
#
# Note: Dependabot reads this file from the DEFAULT branch, so updates only
# begin once it has merged to main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # conform (.conform.yaml) enforces Conventional-Commit type + scope as a
    # regex enum. `ci` + `include: scope` yields `ci(deps): ...` — both `ci`
    # (type) and `^deps$` (scope) are in the allowlist, so Dependabot's auto PRs
    # pass the commit-msg gate.
    commit-message:
      prefix: "ci"
      include: "scope"
    # One grouped PR for all action bumps instead of one PR per action.
    groups:
      actions:
        patterns:
          - "*"
