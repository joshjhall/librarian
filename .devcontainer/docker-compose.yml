services:
  devcontainer:
    build:
      # Build from INSIDE the pinned containers submodule (matches octarine).
      context: ../containers
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: mcr.microsoft.com/devcontainers/base:trixie
        PROJECT_NAME: librarian
        USERNAME: vscode
        WORKING_DIR: /workspace/librarian
        # Command-scoped passwordless sudo (least privilege) — the vscode user
        # may run ONLY the startup-reconciliation commands passwordless, not
        # arbitrary root. Passwordless sudo is REQUIRED, not merely convenient:
        # the image's final USER is vscode (containers/Dockerfile), so the
        # entrypoint runs unprivileged and its run_privileged() helper falls
        # back to `sudo` for startup permission/mount reconciliation — the
        # bindfs FUSE overlay plus the /cache and /run chowns (containers
        # v4.19.11 lib/runtime/entrypoint.sh + lib/runtime/lib/*). Setting this
        # "false" would make `sudo -n` fail at startup, silently skipping those
        # steps and reintroducing the macOS VirtioFS permission bug bindfs
        # exists to fix — so it must stay enabled for this dev image.
        # "scoped" renders a command-scoped /etc/sudoers.d/vscode via
        # render_scoped_sudoers (containers lib/base/sudoers.sh): a Cmnd_Alias
        # limited to bindfs, the docker-socket groupadd/chmod/usermod, and two
        # path-hardcoded wrapper commands (reconcile-cache-owner /
        # reconcile-run-owner) for the variable-uid chowns — never a bare
        # `chown` (which sudo's fnmatch arg-joining would let escape to
        # /etc/sudoers.d and full root). This closes the NOPASSWD:ALL exposure
        # that #97 flagged: a compromised process running as vscode (a shell, a
        # Claude Code tool call, a pulled-in npm dep) can no longer become root.
        # Legacy "true" (full NOPASSWD:ALL) and "false" (password required)
        # remain available; "scoped" is the recommended dev posture. Closes #157
        # (cross-repo follow-up to #97).
        ENABLE_PASSWORDLESS_SUDO: "scoped"
        # Dev tooling: dprint, taplo, shellcheck, shfmt, lefthook, conform,
        # gitleaks, actionlint, rumdl, typos, just, Claude Code CLI.
        INCLUDE_DEV_TOOLS: "true"
        # Additional dev tools
        INCLUDE_OP: "true"
        # Report Claude agent state to the host monitor (Bartender Top Shelf)
        INCLUDE_HOST_EVENTS: "true"
        # Node provides MCP servers + bash-language-server for the bundled
        # workflow scripts. No Rust/Postgres/Redis/docker-in-docker: this is a
        # docs + shell + node + python repo.
        INCLUDE_NODE: "true"
        NODE_VERSION: "24"
        # Python is the primary runtime for the ported patterns.sh pre-scan
        # tools (issue #17); bash is kept only as a legacy fallback. Floor is
        # 3.11 (macOS ships no usable system Python, so requiring 3.11 costs a
        # mac user nothing over 3.10 while 3.10 hits EOL Oct 2026); we develop
        # on 3.12 — one ahead of the floor to catch forward-compat issues,
        # without chasing the containers default (3.14) where libs still lag.
        INCLUDE_PYTHON: "true"
        PYTHON_VERSION: "3.12"
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache,mode=max
    volumes:
      - ..:/workspace/librarian
      # codegraph index: <project>/.codegraph is symlinked here by the dev-tools
      # first-startup hook, so the knowledge-graph index lives on this volume
      # (out of the git tree, droppable to force a clean re-index).
      - librarian-codegraph:/cache/codegraph
    tmpfs:
      # 1Password cache is kept in memory. No uid=/gid= for the same reason — this
      # path is under /cache, so fix_cache_permissions aligns it to the runtime user.
      - /cache/1password/secrets:size=8m,mode=0700
    # Load environment variables from ../.env if present (optional; the file is
    # gitignored local state and is absent in fresh git worktrees). Long-form
    # `required: false` mirrors examples/**/docker-compose.yml so the compose
    # validation hook passes from worktrees instead of erroring on a missing
    # env file.
    env_file:
      - path: ../.env
        required: false
    environment:
      CLAUDE_MCPS: "filesystem,codegraph"
      MEMORY_FILE_PATH: "/workspace/librarian/.claude/memory"
    # tini as PID 1 for zombie reaping (belt-and-suspenders with the Dockerfile).
    init: true
    # CAP_SYS_ADMIN + /dev/fuse are the documented MINIMUM for the bindfs FUSE
    # overlay (containers lib/features/bindfs.sh); no narrower capability lets a
    # FUSE filesystem mount. bindfs exists only to fix macOS/VirtioFS ownership
    # on the ..:/workspace bind mount and runs in `auto` mode, degrading
    # gracefully to a no-op when /dev/fuse is absent — so Linux hosts are
    # unaffected and Mac contributors keep the permission fix. Kept as-is: this
    # is the least privilege that still makes the overlay work.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    command: ["sleep", "infinity"]
    networks:
      - librarian-network

networks:
  librarian-network:
    driver: bridge

volumes:
  # codegraph knowledge-graph index, mounted at /cache/codegraph. Named volume so
  # it survives container rebuilds and can be dropped to force a clean re-index.
  librarian-codegraph:
