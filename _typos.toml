# Spell-check config for the crate-ci/typos binary.
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  # The containers submodule has its own typos policy; don't double-scan it.
  "containers/**",
  "node_modules/**",
  # Generated from commit messages by git-cliff; not hand-authored prose.
  "CHANGELOG.md",
]

[default.extend-words]
# `ba` is the sed branch-to-label idiom (`:a ... ba`) in the CHANGELOG-trimming
# commands in bin/release.sh and bin/generate-release-notes.sh, not a typo.
ba = "ba"
# Truncated regex stems in the review-audit / ship-issue pattern files,
# deliberately matching word variants (updated/update, deprecated/deprecate,
# integrate/integration). Not typos.
updat = "updat"
deprecat = "deprecat"
integrat = "integrat"
# `styl` is the Stylus stylesheet extension (.styl) in test-skip-patterns.
styl = "styl"
# `mis` is the stem of hyphenated compounds (mis-delivered, mis-parsed) in the
# golem-inbox / next-issue prose; typos splits on the hyphen and would misread
# it as `miss`/`mist`. Not a typo.
mis = "mis"
# `unparseable` is the -eable variant, and it is the spelling the OKF
# conformance category is NAMED with: `okf-unparseable-frontmatter` (#668). Both
# spellings are standard English and typos merely prefers the shorter one, but a
# category slug is an identifier — it appears in contract.md, in the emitted TSV,
# in the finding schema, and in the issue that specified it, so renaming it to
# satisfy a preference would break the contract for a cosmetic gain.
unparseable = "unparseable"
Unparseable = "Unparseable"
UNPARSEABLE = "UNPARSEABLE"

# `BRE` is POSIX Basic Regular Expression — the counterpart to ERE, named
# throughout the portability prose and the lint gate (#679). typos reads it as
# `BE`/`BRIE`. The term is standard and cannot be reworded without losing
# precision: BRE vs ERE is exactly the distinction that portability work turns on.
BRE = "BRE"
