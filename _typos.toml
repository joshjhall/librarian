# Spell-check config for the crate-ci/typos binary.
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  # The containers submodule has its own typos policy; don't double-scan it.
  "containers/**",
  "node_modules/**",
  # Generated from commit messages by git-cliff; not hand-authored prose.
  "CHANGELOG.md",
]

[default.extend-words]
# `ba` is the sed branch-to-label idiom (`:a ... ba`) in the CHANGELOG-trimming
# commands in bin/release.sh and bin/generate-release-notes.sh, not a typo.
ba = "ba"
